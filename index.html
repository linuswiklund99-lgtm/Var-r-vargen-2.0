 return {url:json.secure_url,publicId:json.public_id,width:json.width,height:json.height};
}

function activityActions(a){return `<div class="actions"><button class="btn small" data-edit-act="${a.id}">✏️ Redigera</button><button class="btn small" data-send-riddle="${a.id}">Skicka gåta</button><button class="btn small" data-dup-act="${a.id}">Duplicera</button><button class="btn danger small" data-del-act="${a.id}">Ta bort</button></div><div id="edit-${a.id}" class="panel"><input class="input" id="t-${a.id}" value="${esc(a.title)}"><div class="grid"><input class="input" id="d-${a.id}" type="date" value="${esc(a.date||'')}"><input class="input" id="tm-${a.id}" type="time" value="${esc(a.time||'')}"></div><textarea class="input" id="r-${a.id}">${esc(a.riddle||'')}</textarea><select class="input" id="s-${a.id}"><option value="true" ${a.secret?'selected':''}>Hemlig</option><option value="false" ${!a.secret?'selected':''}>Synlig</option></select><select class="input" id="rm-${a.id}"><option value="manual" ${a.riddleMode==='manual'?'selected':''}>Manuell</option><option value="60" ${a.riddleMode==='60'?'selected':''}>60 min innan</option><option value="30" ${a.riddleMode==='30'?'selected':''}>30 min innan</option></select><button class="btn primary" data-save-act="${a.id}">Spara</button></div>`}
function bindActivity(){document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>$(b.dataset.toggle).classList.toggle('open')); const add=$('addAct'); if(add)add.onclick=async()=>{await addDoc(collection(db,'activities'),{title:$('aTitle').value||'Ny aktivitet',date:$('aDate').value,time:$('aTime').value||'12:00',riddle:$('aRiddle').value,secret:$('aSecret').value==='true',riddleMode:$('aRiddleMode').value,createdBy:name,createdAt:serverTimestamp()}); $('newAct').classList.remove('open')}; document.querySelectorAll('[data-edit-act]').forEach(b=>b.onclick=()=>$('edit-'+b.dataset.editAct).classList.toggle('open')); document.querySelectorAll('[data-save-act]').forEach(b=>b.onclick=async()=>{const id=b.dataset.saveAct; await updateDoc(doc(db,'activities',id),{title:$('t-'+id).value,date:$('d-'+id).value,time:$('tm-'+id).value,riddle:$('r-'+id).value,secret:$('s-'+id).value==='true',riddleMode:$('rm-'+id).value});}); document.querySelectorAll('[data-del-act]').forEach(b=>b.onclick=async()=>{if(confirm('Ta bort aktivitet?'))await deleteDoc(doc(db,'activities',b.dataset.delAct))}); document.querySelectorAll('[data-dup-act]').forEach(b=>b.onclick=async()=>{const a=data.activities.find(x=>x.id===b.dataset.dupAct); if(a){const {id,...copy}=a; await addDoc(collection(db,'activities'),{...copy,title:a.title+' kopia',createdAt:serverTimestamp(),createdBy:name});}}); document.querySelectorAll('[data-send-riddle]').forEach(b=>b.onclick=async()=>{const a=data.activities.find(x=>x.id===b.dataset.sendRiddle); if(a) await addDoc(collection(db,'feedPosts'),{type:'riddle',text:`🔓 Ledtråd: ${a.riddle||'Ingen gåta angiven.'}`,createdBy:name,createdAt:serverTimestamp()});});}
function feed(){app.innerHTML=`<section class="card"><h2>Feed</h2><button class="btn primary" data-toggle="newPost">▼ Skapa inlägg</button><div id="newPost" class="panel"><textarea id="postText" class="input" placeholder="Vad händer?"></textarea><input id="postImage" class="fileInput" type="file" accept="image/*"><div id="uploadStatus" class="progress"></div><button id="addPost" class="btn primary">Publicera</button><button id="beerAlarm" class="btn" style="width:100%;margin-top:8px">🍺 Skicka öl-larm</button></div></section><section class="card">${data.feedPosts.map(feedCard).join('')||'<p class="muted">Inga inlägg.</p>'}</section>`; document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>$(b.dataset.toggle).classList.toggle('open')); $('addPost').onclick=async()=>{const text=$('postText').value.trim(); const file=$('postImage').files[0]; if(!text&&!file)return; try{$('uploadStatus').textContent=file?'Laddar upp bild...':''; let image=null; if(file) image=await uploadImage(file,'budapest-2026'); const payload={type:file?'imagePost':'post',text,createdBy:name,createdAt:serverTimestamp()}; if(image){payload.imageUrl=image.url; payload.imagePublicId=image.publicId;} await addDoc(collection(db,'feedPosts'),payload); if(image){await addDoc(collection(db,'galleryImages'),{url:image.url,publicId:image.publicId,caption:text,category:'budapest',createdBy:name,createdAt:serverTimestamp()});} $('postText').value=''; $('postImage').value=''; $('uploadStatus').textContent=''; $('newPost').classList.remove('open');}catch(e){$('uploadStatus').innerHTML=`<span class="error">${esc(e.message)}</span>`}}; const beer=$('beerAlarm'); if(beer)beer.onclick=async()=>{const messages=['För nyktert. Drick för fan.','Budapest börjar bli oroligt.','Micke ser misstänkt ansvarsfull ut.','Vätskenivån är kritiskt låg.','Systemet kräver öl.']; const text=messages[Math.floor(Math.random()*messages.length)]; await addDoc(collection(db,'feedPosts'),{type:'beer',text,createdBy:name,createdAt:serverTimestamp()}); if($('newPost'))$('newPost').classList.remove('open');};
}
function feedCard(p){let body=''; if(p.type==='mission'){body=`<h3>🎯 ${esc(p.title||'Nytt uppdrag')}</h3>${p.description?`<p>${esc(p.description)}</p>`:''}${p.participants?.length?`<p><b>Deltagare:</b> ${p.participants.map(esc).join(', ')}</p>`:''}<span class="pill gold">${Number(p.points||p.maxPoints||0)} maxpoäng</span>`;} else if(p.type==='missionScore'){body=`<h3>🏆 Uppdrag bedömt</h3><p><b>${esc(p.title||'Uppdrag')}</b></p><p>${esc(p.summary||'')}</p>`;} else if(p.type==='punishment'){body=`<h3>⚠️ Straff${p.target?`: ${esc(p.target)}`:''}</h3><p>${esc(p.description||p.text||'')}</p>${p.penaltyPoints?`<span class="pill">-${Math.abs(Number(p.penaltyPoints))} vid miss</span>`:''}`;} else if(p.type==='punishmentScore'){body=`<h3>⚠️ Straffstatus</h3><p>${esc(p.summary||p.text||'')}</p>`;} else if(p.type==='riddle'){body=`<h3>🔓 Ledtråd</h3><p>${esc(p.text||'')}</p>`;} else {body=`<p>${esc(p.text||'')}</p>`;} return `<div class="feedItem">${body}${imgTag(p.imageUrl,p.text||p.title||'Feedbild')}<br><small>${esc(p.createdBy||'')} · ${ts(p.createdAt)}</small></div>`}

function missionCard(m){const parts=(m.participants&&m.participants.length?m.participants:players); const owner=mine(m); return `<div class="card"><div class="between"><h3>🎯 ${esc(m.title)}</h3><span class="pill gold">${m.maxPoints||m.points||0} maxp</span></div><p>${esc(m.description||'')}</p><p class="muted"><b>Deltagare:</b> ${parts.map(esc).join(', ')}</p>${isCrew()?`<p class="muted">${m.status==='draft'?'Utkast':'Publicerad'} · skapad av ${esc(m.createdBy||'')}</p>`:''}${owner?missionOwnerTools(m,parts):''}</div>`}

function punishCard(p){const owner=mine(p); return `<div class="card"><div class="between"><h3>⚠️ ${esc(p.title)}</h3><span class="pill">${esc(p.target||'')}</span></div><p>${esc(p.description||'')}</p><p class="muted">-${Math.abs(Number(p.penaltyPoints||10))} poäng om ej genomfört</p>${isCrew()?`<p class="muted">${p.status==='draft'?'Utkast':'Utdelat'} · skapad av ${esc(p.createdBy||'')}</p>`:''}${owner?`<div class="actions"><button class="btn small" data-edit-p="${p.id}">✏️ Redigera</button><button class="btn small" data-send-p="${p.id}">Dela ut</button><button class="btn small" data-done-p="${p.id}:yes">Genomfört</button><button class="btn small" data-done-p="${p.id}:no">Ej genomfört</button><button class="btn danger small" data-del-p="${p.id}">Ta bort</button></div><div id="ep-${p.id}" class="panel"><input class="input" id="pt-${p.id}" value="${esc(p.title)}"><textarea class="input" id="pd-${p.id}">${esc(p.description||'')}</textarea><select class="input" id="pa-${p.id}">${players.map(x=>`<option ${p.target===x?'selected':''}>${x}</option>`).join('')}</select><input class="input" id="pp-${p.id}" type="number" value="${p.penaltyPoints||10}"><button class="btn primary" data-save-p="${p.id}">Spara</button></div>`:''}</div>`}
async function changeScore(player, points, source, sourceType='manual', sourceId=''){const val=Number(points||0); if(!player || Number.isNaN(val))return; await setDoc(doc(db,'scores',player),{points:(data.scores[player]||0)+val}); await addDoc(collection(db,'scoreEvents'),{player,points:val,source,sourceType,sourceId,awardedBy:name,createdAt:serverTimestamp()});}
async function awardMission(id,player,points){const m=data.missions.find(x=>x.id===id); if(!m || !mine(m))return alert('Bara skaparen kan ge poäng för detta uppdrag.'); await changeScore(player,Number(points),m.title,'mission',id); await addDoc(collection(db,'feedPosts'),{type:'missionScore',title:m.title,summary:`${player} ${Number(points)>=0?'+':''}${Number(points)} poäng`,createdBy:name,createdAt:serverTimestamp()});}
function selectedParts(cls){return [...document.querySelectorAll(cls)].filter(x=>x.checked).map(x=>x.value)}
function bindMission(){document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>$(b.dataset.toggle).classList.toggle('open')); const am=$('addMission'); if(am)am.onclick=async()=>{const participants=selectedParts('.mPart'); await addDoc(collection(db,'missions'),{title:$('mTitle').value||'Nytt uppdrag',description:$('mDesc').value,maxPoints:Number($('mPoints').value||0),points:Number($('mPoints').value||0),participants:participants.length?participants:players,status:$('mStatus').value,createdBy:name,ownerName:name,createdAt:serverTimestamp()});}; const ap=$('addPunish'); if(ap)ap.onclick=async()=>{await addDoc(collection(db,'punishments'),{title:$('pTitle').value||'Nytt straff',description:$('pDesc').value,target:$('pTarget').value,penaltyPoints:Number($('pPenalty').value||10),status:'draft',createdBy:name,ownerName:name,createdAt:serverTimestamp()});}; document.querySelectorAll('[data-edit-m]').forEach(b=>b.onclick=()=>$('em-'+b.dataset.editM).classList.toggle('open')); document.querySelectorAll('[data-judge-m]').forEach(b=>b.onclick=()=>$('jm-'+b.dataset.judgeM).classList.toggle('open')); document.querySelectorAll('[data-save-m]').forEach(b=>b.onclick=async()=>{const id=b.dataset.saveM; const parts=selectedParts('.part-'+id); await updateDoc(doc(db,'missions',id),{title:$('mt-'+id).value,description:$('md-'+id).value,maxPoints:Number($('mp-'+id).value||0),points:Number($('mp-'+id).value||0),participants:parts.length?parts:players});}); document.querySelectorAll('[data-pub-m]').forEach(b=>b.onclick=async()=>{const m=data.missions.find(x=>x.id===b.dataset.pubM); if(!m || !mine(m))return alert('Bara skaparen kan publicera.'); await updateDoc(doc(db,'missions',b.dataset.pubM),{status:'published'}); await addDoc(collection(db,'feedPosts'),{type:'mission',title:m.title,description:m.description||'',points:Number(m.maxPoints||m.points||0),participants:m.participants||players,text:`Nytt uppdrag: ${m.title}`,createdBy:name,createdAt:serverTimestamp()});}); document.querySelectorAll('[data-del-m]').forEach(b=>b.onclick=async()=>{const m=data.missions.find(x=>x.id===b.dataset.delM); if(!m || !mine(m))return alert('Bara skaparen kan ta bort.'); if(confirm('Ta bort uppdrag?'))await deleteDoc(doc(db,'missions',b.dataset.delM))}); document.querySelectorAll('[data-award]').forEach(b=>b.onclick=async()=>{const [id,p,v]=b.dataset.award.split(':'); await awardMission(id,p,v);}); document.querySelectorAll('[data-custom-award]').forEach(b=>b.onclick=async()=>{const [id,p]=b.dataset.customAward.split(':'); const v=$('custom-'+id+'-'+p).value; await awardMission(id,p,v);}); document.querySelectorAll('[data-edit-p]').forEach(b=>b.onclick=()=>$('ep-'+b.dataset.editP).classList.toggle('open')); document.querySelectorAll('[data-save-p]').forEach(b=>b.onclick=async()=>{const id=b.dataset.saveP; const p=data.punishments.find(x=>x.id===id); if(!p || !mine(p))return alert('Bara skaparen kan redigera.'); await updateDoc(doc(db,'punishments',id),{title:$('pt-'+id).value,description:$('pd-'+id).value,target:$('pa-'+id).value,penaltyPoints:Number($('pp-'+id).value||10)});}); document.querySelectorAll('[data-send-p]').forEach(b=>b.onclick=async()=>{const p=data.punishments.find(x=>x.id===b.dataset.sendP); if(!p || !mine(p))return alert('Bara skaparen kan dela ut.'); await updateDoc(doc(db,'punishments',b.dataset.sendP),{status:'published'}); await addDoc(collection(db,'feedPosts'),{type:'punishment',title:p.title,description:p.description||p.title,target:p.target,penaltyPoints:p.penaltyPoints||10,text:`⚠️ ${p.target} fick straff: ${p.title}`,createdBy:name,createdAt:serverTimestamp()});}); document.querySelectorAll('[data-done-p]').forEach(b=>b.onclick=async()=>{const [id,done]=b.dataset.doneP.split(':'); const p=data.punishments.find(x=>x.id===id); if(!p || !mine(p))return alert('Bara skaparen kan bedöma.'); if(done==='no'){await changeScore(p.target,-Math.abs(Number(p.penaltyPoints||10)),p.title,'punishment',id); await addDoc(collection(db,'feedPosts'),{type:'punishmentScore',summary:`${p.target} missade straffet "${p.title}" och får -${Math.abs(Number(p.penaltyPoints||10))} poäng`,createdBy:name,createdAt:serverTimestamp()});} else {await addDoc(collection(db,'feedPosts'),{type:'punishmentScore',summary:`${p.target} genomförde straffet "${p.title}"`,createdBy:name,createdAt:serverTimestamp()});}}); document.querySelectorAll('[data-del-p]').forEach(b=>b.onclick=async()=>{const p=data.punishments.find(x=>x.id===b.dataset.delP); if(!p || !mine(p))return alert('Bara skaparen kan ta bort.'); if(confirm('Ta bort straff?'))await deleteDoc(doc(db,'punishments',b.dataset.delP))});}
function score(){app.innerHTML=`<section class="card"><h2>Poäng</h2>${scoreList(false)}</section><section class="card"><h2>Poänglogg</h2>${players.map(p=>`<details class="card"><summary><b>${p}</b> · ${data.scores[p]||0} poäng</summary>${data.scoreEvents.filter(e=>e.player===p).map(e=>`<div class="logItem"><b>${Number(e.points)>=0?'+':''}${e.points}</b> ${esc(e.source||'Poäng')}<br><small>Av ${esc(e.awardedBy||'')} · ${ts(e.createdAt)}</small></div>`).join('')||'<p class="muted">Ingen poänghistorik ännu.</p>'}</details>`).join('')}</section>`;}
function rankIcon(i,total){if(i===0)return '🥇'; if(i===1)return '🥈'; if(i===2)return '🥉'; if(i===total-1)return '🗑️'; if(i===3)return '🍺'; return '•'}
function scoreList(compact){const rows=Object.entries(data.scores).sort((a,b)=>b[1]-a[1]); return rows.map(([p,v],i)=>`<div class="score"><span>${rankIcon(i,rows.length)} ${p}</span><b>${v} p</b></div>`).join('')}
function gallery(){const bud=data.galleryImages.filter(i=>i.category==='budapest'); const allShame=[...STATIC_HALL_IMAGES,...data.galleryImages.filter(i=>i.category==='shame')]; const shame=getHallSelection(allShame); app.innerHTML=`${isCrew()?`<section class="card"><h2>Lägg till bild</h2><button class="btn primary" data-toggle="galleryUpload">▼ Ladda upp</button><div id="galleryUpload" class="panel"><input id="galleryFile" class="fileInput" type="file" accept="image/*"><textarea id="galleryCaption" class="input" placeholder="Caption"></textarea><select id="galleryCategory" class="input"><option value="budapest">Budapest 2026</option><option value="shame">Hall of Shame</option></select><div id="galleryStatus" class="progress"></div><button id="uploadGallery" class="btn primary">Ladda upp</button></div></section>`:''}<section class="card"><h2>Budapest 2026</h2>${bud.length?galleryByDay(bud):'<p class="muted">Bilder från feeden hamnar här automatiskt.</p>'}</section><section class="card"><h2>Hall of Shame</h2><p class="muted">${randomItem(['Historiskt dokumenterade misstag','Material som aldrig borde ha sparats','Mickes juridiska ombud avråder från vidare granskning','Klassificerat material','Bevismaterial'])}</p><p class="galleryNote">Visar 2 slumpade bilder per inloggning.</p>${shame.length?`<div class="galleryGrid">${shame.map(galleryItem).join('')}</div>`:'<p class="muted">Lägg in klassiska Micke-bilder här.</p>'}</section><div id="imageModal" class="modal"><div class="modalBox"><div class="between"><b id="modalTitle">Bild</b><button class="btn small" id="closeModal">Stäng</button></div><div class="sep"></div><img id="modalImg" class="modalImg" src="" alt=""><p id="modalCaption"></p><small id="modalMeta" class="muted"></small><br><a id="modalSave" class="saveLine" target="_blank" rel="noopener">⬇ Spara bild</a><button id="modalDelete" class="btn danger small hidden" style="margin-top:10px">🗑️ Ta bort från Budapest 2026</button></div></div>`; document.querySelector function galleryByDay(items){const groups={}; items.forEach(i=>{const key=dayKey(i.createdAt); (groups[key]||(groups[key]=[])).push(i)}); return Object.keys(groups).map(day=>`<h3 class="dayTitle">${day}</h3><div class="galleryGrid">${groups[day].map(galleryItem).join('')}</div>`).join('')}
function dayKey(tsv){const d=toDate(tsv); if(!d)return 'Okänt datum'; return d.toLocaleDateString('sv-SE',{weekday:'long',day:'numeric',month:'long'}).replace(/^./,c=>c.toUpperCase())}
function toDate(tsv){if(!tsv)return null; if(tsv.toDate)return tsv.toDate(); if(tsv.seconds)return new Date(tsv.seconds*1000); const d=new Date(tsv); return isNaN(d)?null:d}
function galleryItem(g){const canDelete=isCrew()&&g.category==='budapest'&&!String(g.id).startsWith('static-'); return `<div class="galleryItem" data-gallery-id="${g.id}"><img src="${esc(g.url)}" alt="${esc(g.caption||'Bild')}" loading="lazy" onerror="this.alt='Bilden hittades inte. Bilden hittades inte. Kontrollera filnamnet i GitHub.'">${g.caption?`<p>${esc(g.caption)}</p>`:''}<small>${esc(g.createdBy||'')} · ${ts(g.createdAt)}</small>${canDelete?`<button class="btn small galleryDelete" data-delete-image="${g.id}">🗑️ Ta bort</button>`:''}</div>`}
function openImageModal(id){const g=[...STATIC_HALL_IMAGES,...data.galleryImages].find(x=>x.id===id); if(!g)return; $('modalTitle').textContent=g.category==='shame'?'Hall of Shame':'Budapest 2026'; $('modalImg').src=g.url; $('modalImg').alt=g.caption||'Bild'; $('modalCaption').textContent=g.caption||''; $('modalMeta').textContent=`${g.createdBy||''} · ${ts(g.createdAt)}`; $('modalSave').href=downloadUrl(g.url); const del=$('modalDelete'); if(del){if(isCrew()&&g.category==='budapest'&&!String(g.id).startsWith('static-')){del.classList.remove('hidden'); del.onclick=()=>deleteGalleryImage(g.id)}else{del.classList.add('hidden'); del.onclick=null}} $('imageModal').classList.add('open')}
function getHallSelection(all){if(!all.length)return []; const key='hallSelectionV31'; let ids=[]; try{ids=JSON.parse(sessionStorage.getItem(key)||'[]')}catch(e){} let chosen=ids.map(id=>all.find(x=>x.id===id)).filter(Boolean); if(chosen.length!==Math.min(2,all.length)){const shuffled=[...all].sort(()=>Math.random()-.5); chosen=shuffled.slice(0,2); try{sessionStorage.setItem(key,JSON.stringify(chosen.map(x=>x.id)))}catch(e){}} return chosen}
async function deleteGalleryImage(id){const g=data.galleryImages.find(x=>x.id===id); if(!g)return; if(!confirm('Ta bort bilden från Budapest 2026 i appen?'))return; await deleteDoc(doc(db,'galleryImages',id)); const matches=data.feedPosts.filter(p=>p.imagePublicId&&g.publicId&&p.imagePublicId===g.publicId); for(const post of matches){await deleteDoc(doc(db,'feedPosts',post.id));} const modal=$('imageModal'); if(modal)modal.classList.remove('open')}

$('loginBtn').onclick=async()=>{try{$('loginError').innerHTML=''; await signInWithEmailAndPassword(auth,$('email').value,$('password').value)}catch(e){$('loginError').innerHTML=`<div class="error">${esc(e.message)}</div>`}};
$('logoutBtn').onclick=()=>signOut(auth);
onAuthStateChanged(auth,async u=>{user=u; if(!u){$('login').classList.remove('hidden'); document.querySelector('.wrap').classList.add('hidden'); $('nav').classList.add('hidden'); return;} roleFromEmail(u.email); $('login').classList.add('hidden'); document.querySelector('.wrap').classList.remove('hidden'); $('nav').classList.remove('hidden'); await seed(); listen(); render();});
</script>
