<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Var är Vargen?</title>
<style>
:root{--bg:#0d0e12;--card:#181a22;--card2:#222532;--text:#f7f1e7;--muted:#a9a3a0;--gold:#d6b25e;--red:#ff6b6b;--green:#77dd99;--border:rgba(255,255,255,.1)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#28202f 0,#0d0e12 42%,#08090c 100%);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}.wrap{max-width:560px;margin:0 auto;min-height:100vh;padding:18px 14px 92px}.top{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;margin-bottom:18px}.eyebrow{margin:0;color:var(--gold);font-weight:800;letter-spacing:.12em;font-size:12px;text-transform:uppercase}h1{margin:2px 0 0;font-size:25px}small,.muted{color:var(--muted)}button,input,textarea,select{font:inherit}.btn{border:1px solid var(--border);background:#151720;color:var(--text);border-radius:12px;padding:10px 12px;font-weight:800;cursor:pointer}.btn.primary{background:linear-gradient(135deg,#d6b25e,#f2d788);color:#17120a;border:0}.btn.danger{background:#2a1114;color:#ffd2d2;border-color:#7c2c35}.btn.ghost{background:transparent}.btn.small{padding:7px 9px;font-size:12px}.card{background:rgba(24,26,34,.92);border:1px solid var(--border);border-radius:20px;padding:15px;margin:12px 0;box-shadow:0 10px 30px rgba(0,0,0,.24)}.card h2,.card h3{margin:0 0 8px}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.between{display:flex;align-items:center;justify-content:space-between;gap:8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.input,textarea,select{width:100%;background:#10121a;border:1px solid var(--border);border-radius:12px;color:var(--text);padding:11px;margin:6px 0 10px}textarea{min-height:82px;resize:vertical}.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(10,11,15,.95);border-top:1px solid var(--border);display:flex;justify-content:center;gap:3px;padding:9px 6px}.nav button{font-size:11px;padding:8px 7px;border-radius:12px;min-width:54px}.nav button.active{background:var(--gold);color:#141006}.pill{display:inline-flex;border:1px solid var(--border);border-radius:999px;padding:4px 8px;color:var(--muted);font-size:12px}.feedItem{border-left:3px solid var(--gold);padding:10px 0 10px 12px;margin:10px 0}.score{display:flex;justify-content:space-between;padding:12px;border:1px solid var(--border);border-radius:14px;margin:8px 0;background:#12141d}.hidden{display:none!important}.login{max-width:420px;margin:15vh auto;padding:18px}.panel{display:none;margin-top:10px}.panel.open{display:block}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.sep{height:1px;background:var(--border);margin:12px 0}.error{background:#2a1114;border:1px solid #79313c;color:#ffd7d7;border-radius:12px;padding:10px;margin:10px 0}.ok{color:var(--green)}.warn{color:var(--gold)}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div><p class="eyebrow">Budapest 2026</p><h1>Var är Vargen?</h1></div>
    <div style="text-align:right"><small id="userLabel"></small><br><button class="btn small" id="logoutBtn">Logga ut</button></div>
  </header>
  <main id="app"></main>
</div>
<nav id="nav" class="nav"></nav>
<div id="login" class="login card hidden">
  <p class="eyebrow">Inloggning</p><h1>Var är Vargen?</h1>
  <input id="email" class="input" placeholder="E-post" autocomplete="username">
  <input id="password" class="input" placeholder="Lösenord" type="password" autocomplete="current-password">
  <button id="loginBtn" class="btn primary" style="width:100%">Logga in</button>
  <div id="loginError"></div>
</div>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { getFirestore, collection, doc, addDoc, setDoc, updateDoc, deleteDoc, onSnapshot, query, orderBy, serverTimestamp, getDocs } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
const firebaseConfig={apiKey:"AIzaSyClYJkGbaz_H0qDSoaeUXBYiSfJ7JY-0Zk",authDomain:"var-ar-vargen-d69ab.firebaseapp.com",projectId:"var-ar-vargen-d69ab",storageBucket:"var-ar-vargen-d69ab.firebasestorage.app",messagingSenderId:"302114756240",appId:"1:302114756240:web:5b174a9efd1a87cecf6a15"};
const fb=initializeApp(firebaseConfig), auth=getAuth(fb), db=getFirestore(fb);
let user=null, role='micke', name='Micke', page='home';
let data={activities:[],feedPosts:[],missions:[],punishments:[],scores:{Linus:0,Olle:0,Karl:0,Micke:0}};
const players=['Linus','Olle','Karl','Micke'];
const $=id=>document.getElementById(id); const app=$('app');
function esc(s=''){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function roleFromEmail(email){const e=(email||'').toLowerCase(); const first=e.split('@')[0]; name=first?first[0].toUpperCase()+first.slice(1):'Micke'; role= first==='micke'?'micke':'crew'; if(['linus','olle','karl','gabbe'].includes(first)) role='crew'; if(first==='micke') name='Micke';}
function isCrew(){return role==='crew'}
function ts(d){if(!d)return ''; try{const x=d.toDate?d.toDate():new Date(d); return x.toLocaleString('sv-SE',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});}catch{return ''}}
function timeKey(a){return (a.date||'2026-07-17')+'T'+(a.time||'00:00')}
function sortActivities(arr){return [...arr].sort((a,b)=>timeKey(a).localeCompare(timeKey(b)))}
async function seed(){const snap=await getDocs(collection(db,'scores')); if(snap.empty){for(const p of players) await setDoc(doc(db,'scores',p),{points:0});}
 const as=await getDocs(collection(db,'activities')); if(as.empty){await addDoc(collection(db,'activities'),{title:'Hämtning i Örebro',date:'2026-07-17',time:'04:30',secret:false,riddle:'',riddleMode:'manual',createdBy:name,createdAt:serverTimestamp()}); await addDoc(collection(db,'activities'),{title:'Escape Room',date:'2026-07-17',time:'16:30',secret:true,riddle:'Du kommer bli instängd. Men frivilligt.',riddleMode:'60',createdBy:name,createdAt:serverTimestamp()}); await addDoc(collection(db,'activities'),{title:'VM-final på sportbar',date:'2026-07-19',time:'19:30',secret:true,riddle:'Två lag. En vinnare. Miljoner experter.',riddleMode:'60',createdBy:name,createdAt:serverTimestamp()});}}
function listen(){onSnapshot(query(collection(db,'activities')),s=>{data.activities=s.docs.map(d=>({id:d.id,...d.data()})); render()});onSnapshot(query(collection(db,'feedPosts'),orderBy('createdAt','desc')),s=>{data.feedPosts=s.docs.map(d=>({id:d.id,...d.data()})); render()});onSnapshot(query(collection(db,'missions')),s=>{data.missions=s.docs.map(d=>({id:d.id,...d.data()})); render()});onSnapshot(query(collection(db,'punishments')),s=>{data.punishments=s.docs.map(d=>({id:d.id,...d.data()})); render()});onSnapshot(collection(db,'scores'),s=>{let o={};s.docs.forEach(d=>o[d.id]=d.data().points||0);data.scores=o;render()});}
function nav(){let items=[['home','🏠','Hem'],['schedule','📅','Schema'],['feed','📰','Feed'],['missions','🎯','Uppdrag'],['score','🏆','Poäng'],['gallery','📸','Galleri']]; $('nav').innerHTML=items.map(i=>`<button class="btn ${page===i[0]?'active':''}" data-page="${i[0]}">${i[1]}<br>${i[2]}</button>`).join(''); document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});}
function render(){if(!user)return; $('userLabel').textContent=`${user.email} · ${name}`; if(page==='crew') page='home'; nav(); if(page==='home') home(); if(page==='schedule') schedule(); if(page==='feed') feed(); if(page==='missions') missions(); if(page==='score') score(); if(page==='gallery') gallery();}
function nextAct(){return sortActivities(data.activities)[0]}
function home(){const a=nextAct(); app.innerHTML=`<section class="card"><p class="eyebrow">Nästa aktivitet</p>${actView(a,true)}</section><section class="card"><h2>Senaste från feed</h2>${data.feedPosts.slice(0,3).map(feedCard).join('')||'<p class="muted">Inga inlägg ännu.</p>'}</section><section class="card"><h2>Poäng</h2>${scoreList(true)}</section><section class="card"><h2>Dagens Micke</h2><div class="score"><span>Status</span><b>Under observation</b></div><p class="muted">Hall of Shame-bilder kopplas in när bildsystemet är klart.</p></section>`}
function actView(a,compact=false){if(!a)return '<p class="muted">Ingen aktivitet.</p>'; const hidden=!isCrew()&&a.secret; return `<div class="between"><div><h3>${hidden?'🔒 Hemlig aktivitet':esc(a.title)}</h3><p class="muted">${esc(a.date||'')} · ${esc(a.time||'')}</p>${(!hidden&&a.riddle)?`<p><b>Gåta:</b> ${esc(a.riddle)}</p>`:''}</div>${isCrew()&&!compact?`<span class="pill">${a.secret?'Hemlig':'Synlig'}</span>`:''}</div>`}
function schedule(){const form=isCrew()?createActivityPanel():''; app.innerHTML=`${form}<section class="card"><h2>Schema</h2>${sortActivities(data.activities).map(a=>`<div class="card">${actView(a)}${isCrew()?activityActions(a):''}</div>`).join('')}</section>`; bindActivity();}
function createActivityPanel(){return `<section class="card"><button class="btn primary" data-toggle="newAct">▼ Ny aktivitet</button><div id="newAct" class="panel"><input class="input" id="aTitle" placeholder="Titel"><div class="grid"><input class="input" id="aDate" type="date" value="2026-07-17"><input class="input" id="aTime" type="time"></div><textarea id="aRiddle" placeholder="Gåta" class="input"></textarea><select id="aSecret" class="input"><option value="true">Hemlig för Micke</option><option value="false">Synlig för Micke</option></select><select id="aRiddleMode" class="input"><option value="manual">Manuell gåta</option><option value="60">60 min innan</option><option value="30">30 min innan</option></select><button class="btn primary" id="addAct">Skapa aktivitet</button></div></section>`}
function activityActions(a){return `<div class="actions"><button class="btn small" data-edit-act="${a.id}">✏️ Redigera</button><button class="btn small" data-send-riddle="${a.id}">🔓 Skicka gåta</button><button class="btn small" data-dup-act="${a.id}">📋 Duplicera</button><button class="btn danger small" data-del-act="${a.id}">🗑 Ta bort</button></div><div id="edit-${a.id}" class="panel"><input class="input" id="t-${a.id}" value="${esc(a.title)}"><div class="grid"><input class="input" id="d-${a.id}" type="date" value="${esc(a.date||'')}"><input class="input" id="tm-${a.id}" type="time" value="${esc(a.time||'')}"></div><textarea class="input" id="r-${a.id}">${esc(a.riddle||'')}</textarea><select class="input" id="s-${a.id}"><option value="true" ${a.secret?'selected':''}>Hemlig</option><option value="false" ${!a.secret?'selected':''}>Synlig</option></select><select class="input" id="rm-${a.id}"><option value="manual" ${a.riddleMode==='manual'?'selected':''}>Manuell</option><option value="60" ${a.riddleMode==='60'?'selected':''}>60 min innan</option><option value="30" ${a.riddleMode==='30'?'selected':''}>30 min innan</option></select><button class="btn primary" data-save-act="${a.id}">Spara</button></div>`}
function bindActivity(){document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>$(b.dataset.toggle).classList.toggle('open')); const add=$('addAct'); if(add)add.onclick=async()=>{await addDoc(collection(db,'activities'),{title:$('aTitle').value||'Ny aktivitet',date:$('aDate').value,time:$('aTime').value||'12:00',riddle:$('aRiddle').value,secret:$('aSecret').value==='true',riddleMode:$('aRiddleMode').value,createdBy:name,createdAt:serverTimestamp()}); $('newAct').classList.remove('open')}; document.querySelectorAll('[data-edit-act]').forEach(b=>b.onclick=()=>$('edit-'+b.dataset.editAct).classList.toggle('open')); document.querySelectorAll('[data-save-act]').forEach(b=>b.onclick=async()=>{const id=b.dataset.saveAct; await updateDoc(doc(db,'activities',id),{title:$('t-'+id).value,date:$('d-'+id).value,time:$('tm-'+id).value,riddle:$('r-'+id).value,secret:$('s-'+id).value==='true',riddleMode:$('rm-'+id).value});}); document.querySelectorAll('[data-del-act]').forEach(b=>b.onclick=async()=>{if(confirm('Ta bort aktivitet?'))await deleteDoc(doc(db,'activities',b.dataset.delAct))}); document.querySelectorAll('[data-dup-act]').forEach(b=>b.onclick=async()=>{const a=data.activities.find(x=>x.id===b.dataset.dupAct); if(a)await addDoc(collection(db,'activities'),{...a,title:a.title+' kopia',createdAt:serverTimestamp(),createdBy:name});}); document.querySelectorAll('[data-send-riddle]').forEach(b=>b.onclick=async()=>{const a=data.activities.find(x=>x.id===b.dataset.sendRiddle); if(a) await addDoc(collection(db,'feedPosts'),{type:'riddle',text:`🔓 Ledtråd: ${a.riddle||'Ingen gåta angiven.'}`,createdBy:name,createdAt:serverTimestamp()});});}
function feed(){app.innerHTML=`<section class="card"><h2>Feed</h2><button class="btn primary" data-toggle="newPost">▼ Skapa inlägg</button><div id="newPost" class="panel"><textarea id="postText" class="input" placeholder="Vad händer?"></textarea><button id="addPost" class="btn primary">Publicera</button></div></section><section class="card">${data.feedPosts.map(feedCard).join('')||'<p class="muted">Inga inlägg.</p>'}</section>`; document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>$(b.dataset.toggle).classList.toggle('open')); $('addPost').onclick=async()=>{if(!$('postText').value.trim())return; await addDoc(collection(db,'feedPosts'),{type:'post',text:$('postText').value,createdBy:name,createdAt:serverTimestamp()}); $('postText').value=''; $('newPost').classList.remove('open')};}
function feedCard(p){let body=''; if(p.type==='mission'){body=`<h3>🎯 ${esc(p.title||'Nytt uppdrag')}</h3>${p.description?`<p>${esc(p.description)}</p>`:''}<span class="pill">${Number(p.points||0)} poäng</span>`;} else if(p.type==='punishment'){body=`<h3>⚠️ Straff${p.target?`: ${esc(p.target)}`:''}</h3><p>${esc(p.description||p.text||'')}</p>`;} else {body=`<p>${esc(p.text||'')}</p>`;} return `<div class="feedItem"><div class="between"><b>${esc(p.createdBy||'System')}</b><small>${ts(p.createdAt)}</small></div>${body}</div>`}
function missions(){const visible=data.missions.filter(m=>m.status==='published'||m.createdBy===name); app.innerHTML=`${isCrew()?missionPanels():''}<section class="card"><h2>Uppdrag</h2>${visible.map(m=>`<div class="card"><div class="between"><h3>🎯 ${esc(m.title)}</h3><span class="pill">${m.points||0} poäng</span></div><p>${esc(m.description||'')}</p>${isCrew()?`<p class="muted">${m.status==='draft'?'Utkast':'Publicerad'} · skapad av ${esc(m.createdBy||'')}</p><div class="actions"><button class="btn small" data-edit-m="${m.id}">✏️</button><button class="btn small" data-pub-m="${m.id}">📢 Publicera</button><button class="btn danger small" data-del-m="${m.id}">🗑</button></div><div id="em-${m.id}" class="panel"><input class="input" id="mt-${m.id}" value="${esc(m.title)}"><textarea class="input" id="md-${m.id}">${esc(m.description||'')}</textarea><input class="input" id="mp-${m.id}" type="number" value="${m.points||0}"><button class="btn primary" data-save-m="${m.id}">Spara</button></div>`:''}</div>`).join('')||'<p class="muted">Inga uppdrag ännu.</p>'}</section><section class="card"><h2>Straff</h2>${data.punishments.filter(p=>p.status==='published'||p.createdBy===name).map(p=>punishCard(p)).join('')||'<p class="muted">Inga straff.</p>'}</section>`; bindMission();}
function missionPanels(){return `<section class="card"><button class="btn primary" data-toggle="newMission">▼ Nytt uppdrag</button><div id="newMission" class="panel"><input id="mTitle" class="input" placeholder="Titel"><textarea id="mDesc" class="input" placeholder="Beskrivning"></textarea><input id="mPoints" class="input" type="number" placeholder="Poäng"><select id="mStatus" class="input"><option value="draft">Spara som utkast</option><option value="published">Publicera direkt</option></select><button id="addMission" class="btn primary">Spara uppdrag</button></div><div class="sep"></div><button class="btn primary" data-toggle="newPunish">▼ Nytt straff</button><div id="newPunish" class="panel"><input id="pTitle" class="input" placeholder="Titel"><textarea id="pDesc" class="input" placeholder="Beskrivning"></textarea><select id="pTarget" class="input">${players.map(p=>`<option>${p}</option>`).join('')}</select><button id="addPunish" class="btn primary">Spara straff</button></div></section>`}
function punishCard(p){return `<div class="card"><div class="between"><h3>⚠️ ${esc(p.title)}</h3><span class="pill">${esc(p.target||'')}</span></div><p>${esc(p.description||'')}</p>${isCrew()?`<div class="actions"><button class="btn small" data-edit-p="${p.id}">✏️</button><button class="btn small" data-send-p="${p.id}">📢 Dela ut</button><button class="btn danger small" data-del-p="${p.id}">🗑</button></div><div id="ep-${p.id}" class="panel"><input class="input" id="pt-${p.id}" value="${esc(p.title)}"><textarea class="input" id="pd-${p.id}">${esc(p.description||'')}</textarea><select class="input" id="pa-${p.id}">${players.map(x=>`<option ${p.target===x?'selected':''}>${x}</option>`).join('')}</select><button class="btn primary" data-save-p="${p.id}">Spara</button></div>`:''}</div>`}
function bindMission(){document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>$(b.dataset.toggle).classList.toggle('open')); const am=$('addMission'); if(am)am.onclick=async()=>{await addDoc(collection(db,'missions'),{title:$('mTitle').value||'Nytt uppdrag',description:$('mDesc').value,points:Number($('mPoints').value||0),status:$('mStatus').value,createdBy:name,createdAt:serverTimestamp()});}; const ap=$('addPunish'); if(ap)ap.onclick=async()=>{await addDoc(collection(db,'punishments'),{title:$('pTitle').value||'Nytt straff',description:$('pDesc').value,target:$('pTarget').value,status:'draft',createdBy:name,createdAt:serverTimestamp()});}; document.querySelectorAll('[data-edit-m]').forEach(b=>b.onclick=()=>$('em-'+b.dataset.editM).classList.toggle('open')); document.querySelectorAll('[data-save-m]').forEach(b=>b.onclick=async()=>{const id=b.dataset.saveM; await updateDoc(doc(db,'missions',id),{title:$('mt-'+id).value,description:$('md-'+id).value,points:Number($('mp-'+id).value||0)});}); document.querySelectorAll('[data-pub-m]').forEach(b=>b.onclick=async()=>{const m=data.missions.find(x=>x.id===b.dataset.pubM); await updateDoc(doc(db,'missions',b.dataset.pubM),{status:'published'}); await addDoc(collection(db,'feedPosts'),{type:'mission',title:m.title,description:m.description||'',points:Number(m.points||0),text:`🎯 Nytt uppdrag: ${m.title} (${m.points||0} poäng)`,createdBy:name,createdAt:serverTimestamp()});}); document.querySelectorAll('[data-del-m]').forEach(b=>b.onclick=async()=>{if(confirm('Ta bort uppdrag?'))await deleteDoc(doc(db,'missions',b.dataset.delM))}); document.querySelectorAll('[data-edit-p]').forEach(b=>b.onclick=()=>$('ep-'+b.dataset.editP).classList.toggle('open')); document.querySelectorAll('[data-save-p]').forEach(b=>b.onclick=async()=>{const id=b.dataset.saveP; await updateDoc(doc(db,'punishments',id),{title:$('pt-'+id).value,description:$('pd-'+id).value,target:$('pa-'+id).value});}); document.querySelectorAll('[data-send-p]').forEach(b=>b.onclick=async()=>{const p=data.punishments.find(x=>x.id===b.dataset.sendP); await updateDoc(doc(db,'punishments',b.dataset.sendP),{status:'published'}); await addDoc(collection(db,'feedPosts'),{type:'punishment',title:p.title,description:p.description||p.title,target:p.target,text:`⚠️ ${p.target} fick straff: ${p.title}`,createdBy:name,createdAt:serverTimestamp()});}); document.querySelectorAll('[data-del-p]').forEach(b=>b.onclick=async()=>{if(confirm('Ta bort straff?'))await deleteDoc(doc(db,'punishments',b.dataset.delP))});}
function score(){app.innerHTML=`<section class="card"><h2>Poäng</h2>${scoreList(false)}${isCrew()?players.map(p=>`<div class="actions"><b style="min-width:58px">${p}</b><button class="btn small" data-score="${p}:5">+5</button><button class="btn small" data-score="${p}:10">+10</button><button class="btn small" data-score="${p}:-5">-5</button></div>`).join(''):''}</section>`; document.querySelectorAll('[data-score]').forEach(b=>b.onclick=async()=>{const [p,v]=b.dataset.score.split(':'); await setDoc(doc(db,'scores',p),{points:(data.scores[p]||0)+Number(v)});});}
function scoreList(compact){return Object.entries(data.scores).sort((a,b)=>b[1]-a[1]).map(([p,v],i)=>`<div class="score"><span>${['🥇','🥈','🥉','🍺'][i]||'•'} ${p}</span><b>${v} p</b></div>`).join('')}
function gallery(){app.innerHTML=`<section class="card"><h2>Budapest 2026</h2><p class="muted">Bilduppladdning kopplas in senare.</p></section><section class="card"><h2>Hall of Shame</h2><p class="muted">Ett rullande bildflöde med gamla Micke-bilder kommer här.</p></section>`}
$('loginBtn').onclick=async()=>{try{$('loginError').innerHTML=''; await signInWithEmailAndPassword(auth,$('email').value,$('password').value)}catch(e){$('loginError').innerHTML=`<div class="error">${esc(e.message)}</div>`}};
$('logoutBtn').onclick=()=>signOut(auth);
onAuthStateChanged(auth,async u=>{user=u; if(!u){$('login').classList.remove('hidden'); document.querySelector('.wrap').classList.add('hidden'); $('nav').classList.add('hidden'); return;} roleFromEmail(u.email); $('login').classList.add('hidden'); document.querySelector('.wrap').classList.remove('hidden'); $('nav').classList.remove('hidden'); await seed(); listen(); render();});
</script>
</body>
</html>
