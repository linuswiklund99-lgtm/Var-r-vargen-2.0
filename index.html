<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Var är Vargen?</title>
<style>
:root{--bg:#0d0e12;--card:#181a21;--card2:#222532;--text:#f7f1e7;--muted:#aaa39a;--gold:#d6b25e;--gold2:#f2d788;--border:rgba(255,255,255,.1)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#25202b 0,#0d0e12 42%);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}.app{max-width:520px;margin:0 auto;min-height:100vh;padding:18px 14px 92px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.eyebrow{margin:0 0 4px;color:var(--gold2);text-transform:uppercase;letter-spacing:.13em;font-size:11px;font-weight:800}h1{margin:0;font-size:28px;letter-spacing:-.04em}h2{margin:0 0 12px;font-size:20px}h3{margin:0 0 6px}.btn,.chip{border:1px solid var(--border);border-radius:999px;background:rgba(255,255,255,.06);color:var(--text);padding:10px 12px;font:inherit;cursor:pointer}.primary{background:linear-gradient(135deg,var(--gold2),#8a672b);color:#17110a;border:0;font-weight:900}.screen{display:grid;gap:13px}.card{background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.025));border:1px solid var(--border);border-radius:24px;padding:16px;box-shadow:0 18px 45px rgba(0,0,0,.3)}.muted{color:var(--muted)}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.stack{display:grid;gap:10px}.count{font-size:34px;font-weight:950;color:var(--gold2);letter-spacing:-.05em}.item{background:rgba(255,255,255,.045);border:1px solid var(--border);border-radius:18px;padding:12px}.riddle{border-left:3px solid var(--gold);padding-left:12px;color:#fff2c7}.score{display:grid;grid-template-columns:42px 1fr auto;align-items:center;font-weight:850}.imgbox{border-radius:24px;padding:8px;background:linear-gradient(135deg,var(--gold2),#6d511f,var(--gold))}.placeholder{border-radius:18px;min-height:220px;display:grid;place-items:center;background:linear-gradient(135deg,#3a2f42,#16171d);font-size:52px}.feedmeta{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-top:6px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.photo{aspect-ratio:1;border-radius:17px;background:linear-gradient(135deg,#30283a,#15161b);display:grid;place-items:center;font-size:36px}.nav{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);width:min(520px,calc(100vw - 18px));display:grid;gap:5px;grid-auto-flow:column;background:rgba(15,16,20,.92);border:1px solid var(--border);border-radius:24px;padding:8px;backdrop-filter:blur(14px)}.nav button{border:0;background:transparent;color:var(--muted);border-radius:16px;padding:8px 4px;font-size:11px;display:grid;gap:2px;place-items:center}.nav button.active{background:rgba(214,178,94,.16);color:var(--gold2)}.nav b{font-size:18px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:grid;place-items:center;padding:18px}.hidden{display:none}.modalcard{width:min(420px,100%);background:#17191f;border:1px solid var(--border);border-radius:26px;padding:18px}.roles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.small{font-size:13px}@media(max-width:390px){.app{padding-left:10px;padding-right:10px}.nav{width:calc(100vw - 10px)}h1{font-size:24px}.count{font-size:30px}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div><p class="eyebrow">Budapest 2026</p><h1>Var är Vargen?</h1></div>
    <button class="btn" id="roleBtn">Micke</button>
  </header>
  <main id="app" class="screen"></main>
  <nav id="nav" class="nav"></nav>
</div>
<div id="modal" class="modal hidden">
  <div class="modalcard">
    <h2>Välj roll</h2><p class="muted">Demo-läge innan riktig inloggning.</p>
    <div class="roles">
      <button class="btn primary" data-role="micke">Micke</button>
      <button class="btn" data-role="crew">Crew</button>
      <button class="btn" data-role="gabbe">Gabbe</button>
      <button class="btn" data-role="nicole">Nicole HQ</button>
    </div>
    <button class="btn" id="closeBtn">Stäng</button>
  </div>
</div>
<script>
(function(){
'use strict';
const state={role:'micke',page:'home',scores:[['Karl',75],['Linus',72],['Micke',68],['Olle',66]],activities:[
['Fredag','04:30','Hämtning i Örebro',true,'🚗',''],['Fredag','08:00','Flyg från Arlanda',true,'✈️',''],['Fredag','10:30','Landar i Budapest',true,'🇭🇺',''],['Fredag','12:00','Lunch och första uppdrag',true,'🍽️',''],['Fredag','16:30','Escape Room - Neverland',false,'🔒','Du kommer bli instängd. Men frivilligt.'],['Fredag','18:30','Middag',true,'🍽️',''],['Lördag','11:00','Proseccobåt',false,'🥂','Dagens transportmedel kräver viss balans.'],['Lördag','23:00','Rave',false,'🎛️','När basen tar över finns ingen återvändo.'],['Söndag','19:30','VM-final på sportbar',false,'⚽','Två lag. En vinnare. Miljarder experter.'],['Måndag','10:00','Hemfärd',true,'✈️','']
],feed:[['📸','Karl','Fredag 12:24','Micke tror fortfarande att vi är här för kulturen.',true],['🍺','Systemet','Fredag 13:02','Öl-larm utlöst: För nyktert. Drick för fan.',true],['🎯','Game Master','Fredag 13:18','Nytt uppdrag aktiverat: Lär en främling svenska.',false],['⚠️','Game Master','Fredag 14:10','Straff utdelat. Situationen kräver omedelbar åtgärd.',false],['📸','Linus','Fredag 15:04','Han har börjat ana oråd.',true]],missions:[['Lär en främling svenska','Få en okänd person att säga: Jag heter Micke.',20,'Aktiv'],['Beställ på ungerska','Beställ valfri dryck med maximal självsäkerhet.',10,'Utkast']],punishments:[['Turist-armhävningar','Gör 10 armhävningar framför närmaste turist.','Gata'],['Bar-sång','Sjung valfri refräng med allvarlig inlevelse.','Bar']]};
const menus={micke:[['home','🏠','Hem'],['schedule','📅','Schema'],['feed','📰','Feed'],['missions','🎯','Uppdrag'],['scores','🏆','Poäng'],['gallery','📸','Galleri']],crew:[['home','🏠','Hem'],['schedule','📅','Schema'],['feed','📰','Feed'],['scores','🏆','Poäng'],['gallery','📸','Galleri'],['crew','⚙️','Crew']],gabbe:[['home','🏠','Hem'],['schedule','📅','Schema'],['feed','📰','Feed'],['scores','🏆','Poäng'],['gallery','📸','Galleri'],['crew','⚙️','Crew'],['gm','🎮','GM']],nicole:[['feed','📰','Nicole HQ']]};
const $=id=>document.getElementById(id);const app=$('app'),nav=$('nav'),modal=$('modal'),roleBtn=$('roleBtn');
function roleName(){return {micke:'Micke',crew:'Crew',gabbe:'Gabbe',nicole:'Nicole HQ'}[state.role]}function secret(){return state.role==='crew'||state.role==='gabbe'}function set(html){app.innerHTML=html}function scores(){return state.scores.slice().sort((a,b)=>b[1]-a[1])}function title(a){return (a[3]||secret())?`${a[4]} ${a[2]}`:'🔒 Hemlig aktivitet'}
function feedItems(limit){let items=state.feed.filter(f=>state.role!=='nicole'||f[4]);if(limit)items=items.slice(0,limit);return items.map(f=>`<div class="item"><h3>${f[0]} ${f[1]}</h3><p>${f[3]}</p><div class="feedmeta"><span>${f[2]}</span><span>${state.role==='nicole'?'🍺':'😂 🍺'}</span></div></div>`).join('')}
function renderNav(){nav.innerHTML=menus[state.role].map(m=>`<button class="${state.page===m[0]?'active':''}" data-page="${m[0]}"><b>${m[1]}</b><span>${m[2]}</span></button>`).join('');nav.querySelectorAll('button').forEach(b=>b.onclick=()=>{state.page=b.dataset.page;render()})}
function home(){const next=state.activities[4];set(`<section class="card"><p class="eyebrow">Nästa aktivitet</p><h2>${title(next)}</h2><div class="count">01:42</div><p class="muted">kvar till nästa händelse</p>${(!next[3]&&!secret())?`<p class="riddle">${next[5]}</p>`:''}</section><section class="card"><h2>📰 Senaste från Feed</h2><div class="stack">${feedItems(3)}</div></section><section class="card"><h2>🏆 Ställning</h2><div class="stack">${scores().map((s,i)=>`<div class="item score"><span>${['🥇','🥈','🥉','🍺'][i]}</span><span>${s[0]}</span><span>${s[1]} p</span></div>`).join('')}</div></section><section class="card"><p class="eyebrow">Dagens Micke</p><h2>📸 Under observation</h2><div class="imgbox"><div class="placeholder">😎</div></div><p class="muted">Kommentar: Har ännu inte förstått omfattningen av helgen.</p></section>`)}
function schedule(){const days=[...new Set(state.activities.map(a=>a[0]))];set(days.map(d=>`<section class="card"><h2>${d}</h2><div class="stack">${state.activities.filter(a=>a[0]===d).map(a=>`<div class="item"><div class="row"><strong>${a[1]}</strong><span>${title(a)}</span></div>${(!a[3]&&!secret()&&a[5])?`<p class="riddle">${a[5]}</p>`:''}${(secret()&&a[5])?`<p class="muted small">Gåta: ${a[5]}</p>`:''}</div>`).join('')}</div></section>`).join(''))}
function feed(){set(`<section class="card"><p class="eyebrow">${state.role==='nicole'?'Nicole HQ':'Live Feed'}</p><h2>📰 Rapport från Budapest</h2><div class="stack">${feedItems()}</div></section>`)}
function scorePage(){set(`<section class="card"><h2>🏆 Poängliga</h2><div class="stack">${scores().map((s,i)=>`<div class="item score"><span>${['🥇','🥈','🥉','🍺'][i]}</span><span>${s[0]}</span><span>${s[1]} p</span></div>`).join('')}</div></section>`)}
function missions(){set(`<section class="card"><h2>🎯 Aktiva uppdrag</h2><div class="stack">${state.missions.filter(m=>m[3]==='Aktiv').map(m=>`<div class="item"><h3>${m[0]}</h3><p>${m[1]}</p><strong>${m[2]} poäng</strong></div>`).join('')}</div></section>`)}
function gallery(){set(`<section class="card"><h2>📸 Galleri</h2><p class="muted">Demo-bilder. Här lägger vi in riktiga Micke-bilder senare.</p></section><section class="grid">${Array.from({length:8}).map((_,i)=>`<div class="photo">${['😎','🍺','🎩','🐺'][i%4]}</div>`).join('')}</section>`)}
function crew(){set(`<section class="card"><p class="eyebrow">Crew-panel</p><h2>⚙️ Snabbadmin</h2><div class="stack"><div class="item"><h3>📅 Aktiviteter</h3><p>Ändra tider, gåtor och spoiler protection.</p><button class="btn primary">Redigera aktiviteter</button></div><div class="item"><h3>📸 Bilder</h3><p>Ladda upp bild till Feed och Nicole HQ.</p><button class="btn primary">Ladda upp bild</button></div><div class="item"><h3>🍺 Öl-larm</h3><p>Skicka larm med ful Micke-bild.</p><button class="btn primary">Skicka öl-larm</button></div></div></section>`)}
function gm(){set(`<section class="card"><p class="eyebrow">Game Master</p><h2>🎮 Gabbes kontrollrum</h2><div class="stack"><button class="btn primary">➕ Nytt uppdrag</button><button class="btn primary">⚠️ Nytt straff</button><button class="btn">🎲 Slumpstraff</button></div></section><section class="card"><h2>🎯 Uppdrag</h2><div class="stack">${state.missions.map(m=>`<div class="item"><div class="row"><h3>${m[0]}</h3><span>${m[3]}</span></div><p>${m[1]}</p><p><strong>${m[2]} poäng</strong></p><button class="chip">✏️ Redigera</button> <button class="chip">📋 Duplicera</button> <button class="chip">🗑 Ta bort</button></div>`).join('')}</div></section><section class="card"><h2>⚠️ Straffbibliotek</h2><div class="stack">${state.punishments.map(p=>`<div class="item"><div class="row"><h3>${p[0]}</h3><span>${p[2]}</span></div><p>${p[1]}</p><button class="chip">⚡ Utdela</button> <button class="chip">✏️ Redigera</button> <button class="chip">🗑 Ta bort</button></div>`).join('')}</div></section>`)}
function render(){roleBtn.textContent=roleName();if(state.role==='nicole')state.page='feed';renderNav();({home,schedule,feed,missions,scores:scorePage,gallery,crew,gm}[state.page]||home)()}
roleBtn.onclick=()=>modal.classList.remove('hidden');$('closeBtn').onclick=()=>modal.classList.add('hidden');document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{state.role=b.dataset.role;state.page=menus[state.role][0][0];modal.classList.add('hidden');render()});
render();
})();
</script>
</body>
</html>
