<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Var är Vargen?</title>
<style>
:root{--bg:#0d0e12;--card:#181a21;--card2:#222532;--text:#f7f1e7;--muted:#aaa3a2;--gold:#d6b25e;--gold2:#f2d788;--danger:#ff6b6b;--ok:#6ee7b7;--border:rgba(255,255,255,.1)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#25202b 0,#0d0e12 38%,#08090b 100%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh}.app{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:92px}.top{position:sticky;top:0;z-index:5;padding:16px 16px 12px;background:linear-gradient(180deg,rgba(13,14,18,.98),rgba(13,14,18,.82));backdrop-filter:blur(14px);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px}.eyebrow{margin:0;color:var(--gold2);font-size:12px;letter-spacing:.12em;text-transform:uppercase}.top h1{margin:2px 0 0;font-size:24px;line-height:1.05}.btn{border:1px solid var(--border);background:linear-gradient(180deg,var(--card2),#151720);color:var(--text);border-radius:14px;padding:10px 12px;font-weight:800;cursor:pointer}.btn:active{transform:translateY(1px)}.btn.primary{background:linear-gradient(135deg,#d6b25e,#8f6b24);color:#181008;border:0}.btn.danger{background:rgba(255,107,107,.15);border-color:rgba(255,107,107,.35);color:#ffd6d6}.btn.ok{background:rgba(110,231,183,.12);border-color:rgba(110,231,183,.3);color:#c7ffe9}.btn.small{padding:7px 9px;border-radius:10px;font-size:12px}.screen{padding:16px;display:grid;gap:14px}.card{background:linear-gradient(180deg,rgba(24,26,33,.96),rgba(15,16,22,.96));border:1px solid var(--border);border-radius:22px;padding:16px;box-shadow:0 14px 30px rgba(0,0,0,.22)}.card.hero{border-color:rgba(214,178,94,.35);box-shadow:0 0 0 1px rgba(214,178,94,.08),0 18px 34px rgba(0,0,0,.28)}h2,h3{margin:0 0 10px}p{margin:0;color:var(--muted);line-height:1.45}.muted{color:var(--muted)}.big{font-size:28px;font-weight:900}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.grid{display:grid;gap:10px}.two{grid-template-columns:1fr 1fr}.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:rgba(255,255,255,.04);padding:6px 9px;border-radius:999px;color:var(--muted);font-size:12px}.list{display:grid;gap:10px}.item{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:16px;padding:12px}.feedItem{display:grid;gap:8px}.feedMeta{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:12px}.feedImg{width:100%;max-height:360px;object-fit:cover;border-radius:14px;border:1px solid var(--border);background:#0f1118}.score{display:flex;justify-content:space-between;align-items:center;font-size:18px;font-weight:900;padding:12px;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid var(--border)}.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;z-index:10;max-width:520px;width:100%;display:grid;gap:4px;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:rgba(9,10,13,.93);backdrop-filter:blur(16px);border-top:1px solid var(--border)}.navInner{display:grid;gap:6px;grid-auto-flow:column;grid-auto-columns:1fr}.tab{border:0;background:transparent;color:var(--muted);padding:8px 4px;border-radius:14px;font-size:11px;font-weight:800;display:grid;gap:2px;place-items:center}.tab span{font-size:19px}.tab.active{background:rgba(214,178,94,.14);color:var(--gold2)}.modal{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.62);display:grid;place-items:end center;padding:18px}.hidden{display:none}.modalCard{max-width:520px;width:100%;background:#151720;border:1px solid var(--border);border-radius:24px;padding:16px;box-shadow:0 20px 70px rgba(0,0,0,.55)}.roles{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form{display:grid;gap:10px}.field{display:grid;gap:6px}.field label{font-size:12px;color:var(--gold2);font-weight:900;letter-spacing:.04em}.input,.select,.textarea{width:100%;border:1px solid var(--border);background:#0f1118;color:var(--text);border-radius:14px;padding:12px;font:inherit;outline:none}.textarea{min-height:92px;resize:vertical}.check{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px}.adminBox{border:1px solid rgba(214,178,94,.25);background:rgba(214,178,94,.07);border-radius:18px;padding:12px;display:grid;gap:10px}.actions{display:flex;gap:8px;flex-wrap:wrap}.mickePhoto{height:230px;border-radius:20px;background:linear-gradient(135deg,#4d3b1a,#17191f);border:1px solid rgba(214,178,94,.25);display:grid;place-items:center;color:rgba(255,255,255,.65);font-size:48px;overflow:hidden}.mickePhoto small{font-size:14px;color:var(--muted);display:block}.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:92px;background:#171a22;border:1px solid rgba(214,178,94,.35);border-radius:999px;padding:11px 14px;color:var(--gold2);font-weight:900;box-shadow:0 10px 30px rgba(0,0,0,.4);z-index:30}.toast.hidden{display:none}.mini{font-size:12px;color:var(--muted)}@media(max-width:390px){.top h1{font-size:21px}.screen{padding:12px}.card{padding:14px}.roles{grid-template-columns:1fr}.big{font-size:24px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div><p class="eyebrow">Budapest 2026</p><h1>Var är Vargen?</h1></div><button class="btn small" id="roleBtn">Micke</button></header>
<main id="app" class="screen"></main>
<nav class="nav"><div id="nav" class="navInner"></div></nav>
</div>
<div id="modal" class="modal hidden"><div class="modalCard"><h2>Välj roll</h2><p class="muted">Demo-läge innan riktig inloggning.</p><br><div class="roles"><button class="btn primary" data-role="micke">Micke</button><button class="btn" data-role="crew">Crew</button><button class="btn" data-role="gabbe">Gabbe</button><button class="btn" data-role="nicole">Nicole HQ</button></div><br><button class="btn" id="closeBtn">Stäng</button></div></div>
<div id="toast" class="toast hidden"></div>
<script>
(function(){
'use strict';
const players=['Linus','Olle','Karl','Micke'];
const seed={role:'micke',page:'home',scores:{Karl:75,Linus:72,Micke:68,Olle:66},activities:[{id:1,day:'Fredag',time:'04:30',title:'Hämtning i Örebro',public:true,riddle:'Operationen börjar innan solen.',riddleVisible:false,riddleMode:'manual',riddleAt:''},{id:2,day:'Fredag',time:'08:00',title:'Flyg till Budapest',public:true,riddle:'Mot okänd mark.',riddleVisible:false,riddleMode:'manual',riddleAt:''},{id:3,day:'Fredag',time:'16:30',title:'Escape Room',public:false,riddle:'Du kommer bli instängd. Men frivilligt.',riddleVisible:true,riddleMode:'relative',riddleAt:'60'},{id:4,day:'Lördag',time:'11:00',title:'Proseccobåt',public:false,riddle:'Dagens transportmedel har ingen motorväg.',riddleVisible:false,riddleMode:'relative',riddleAt:'60'},{id:5,day:'Söndag',time:'19:30',title:'VM-final på sportbar',public:false,riddle:'Två lag. En vinnare. Miljarder experter.',riddleVisible:false,riddleMode:'relative',riddleAt:'60'},{id:6,day:'Måndag',time:'10:00',title:'Hemfärd',public:true,riddle:'Svensexan avslutas. Kroppen protesterar.',riddleVisible:false,riddleMode:'manual',riddleAt:''}],feed:[{type:'📢',author:'Systemet',text:'Var är Vargen är online.',time:Date.now()-1000*60*60,nicole:true},{type:'📸',author:'Karl',text:'Micke tror fortfarande att detta är en vanlig resa.',time:Date.now()-1000*60*30,nicole:true},{type:'🍺',author:'Crew',text:'Ölstatus: preliminärt acceptabel.',time:Date.now()-1000*60*12,nicole:true}],missions:[{id:1,title:'Lär en främling svenska',desc:'Få en okänd person att säga: Jag heter Micke.',points:20,status:'Aktiv'}],punishments:[{id:1,title:'Turist-armhävningar',desc:'Gör 10 armhävningar framför närmaste turist.',status:'Utkast'}]};
let state=load();
function load(){try{const saved=JSON.parse(localStorage.getItem('vargen06')); if(saved) return migrate(saved); const old=JSON.parse(localStorage.getItem('vargen05')); if(old) return migrate(old); return structuredClone(seed)}catch(e){return JSON.parse(JSON.stringify(seed))}}
function migrate(s){s.activities=(s.activities||seed.activities).map(a=>({...a,riddleMode:a.riddleMode||'manual',riddleAt:a.riddleAt||''}));s.feed=(s.feed||seed.feed).map(f=>({...f,time:typeof f.time==='number'?f.time:Date.now()}));s.missions=s.missions||[];s.punishments=s.punishments||[];s.scores=s.scores||structuredClone(seed.scores);s.role=s.role||'micke';s.page=s.page||'home';return s}
function save(){localStorage.setItem('vargen06',JSON.stringify(state))}
const $=id=>document.getElementById(id), app=$('app'), nav=$('nav');
function toast(t){const el=$('toast');el.textContent=t;el.classList.remove('hidden');setTimeout(()=>el.classList.add('hidden'),1900)}
function canCrew(){return state.role==='crew'||state.role==='gabbe'} function canGM(){return state.role==='gabbe'}
const labels={micke:'Micke',crew:'Crew',gabbe:'Gabbe',nicole:'Nicole HQ'};
function nowLabel(ts){try{return new Intl.DateTimeFormat('sv-SE',{weekday:'short',hour:'2-digit',minute:'2-digit'}).format(new Date(ts))}catch(e){return 'Nu'}}
function addFeed(type,author,text,nicole,img){state.feed.push({type,author,text,time:Date.now(),nicole:!!nicole,img:img||''})}
function pages(){ if(state.role==='nicole')return [['feed','📰','Feed']]; let p=[['home','🏠','Hem'],['schedule','📅','Schema'],['feed','📰','Feed']]; if(state.role==='micke'||state.role==='gabbe')p.push(['missions','🎯','Uppdrag']); p.push(['score','🏆','Poäng'],['gallery','📸','Galleri']); if(canCrew())p.push(['crew','⚙️','Crew']); if(canGM())p.push(['gm','🎮','GM']); return p; }
function render(){ $('roleBtn').textContent=labels[state.role]; if(state.role==='nicole' && state.page!=='feed') state.page='feed'; if(!pages().some(p=>p[0]===state.page)) state.page='home'; nav.innerHTML=pages().map(p=>`<button class="tab ${state.page===p[0]?'active':''}" data-page="${p[0]}"><span>${p[1]}</span>${p[2]}</button>`).join(''); nav.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{state.page=b.dataset.page;save();render()}); ({home,schedule,feed,missions,score,gallery,crew,gm}[state.page]||home)(); }
function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function visibleActivity(a){return a.public||canCrew()?`${a.public?'':'🔒 '}${esc(a.title)}`:'🔒 Hemlig aktivitet'}
function nextActivity(){return state.activities.find(a=>!a.done)||state.activities[0]}
function home(){let next=nextActivity(); app.innerHTML=`<section class="card hero"><p class="eyebrow">Nästa aktivitet</p><h2>${visibleActivity(next)}</h2><div class="big">${esc(next.time)}</div>${next.riddleVisible||canCrew()?`<div class="item"><b>Ledtråd</b><p>${esc(next.riddle)}</p></div>`:''}</section>${feedPreview()}${scorePreview()}<section class="card"><h2>📸 Dagens Micke</h2><div class="mickePhoto">📸<small>Dagens bild kopplas in här</small></div><br><p><b>Status:</b> Misstänkt nöjd</p><p><b>Kommentar:</b> Har ännu inte förstått omfattningen av helgen.</p></section>`}
function feedPreview(){return `<section class="card"><div class="row"><h2>Senaste från Feed</h2><button class="btn small" onclick="window.vargenGo('feed')">Visa allt</button></div><div class="list">${state.feed.slice(-3).reverse().map(feedCard).join('')}</div></section>`}
function scorePreview(){return `<section class="card"><h2>🏆 Ställning</h2><div class="list">${Object.entries(state.scores).sort((a,b)=>b[1]-a[1]).map(([n,s],i)=>`<div class="score"><span>${['🥇','🥈','🥉','🍺'][i]||''} ${esc(n)}</span><span>${s}</span></div>`).join('')}</div></section>`}
function schedule(){let days=[...new Set(state.activities.map(a=>a.day))]; app.innerHTML=`<section class="card"><h2>📅 Schema</h2><p>Spoiler Protection är på för Micke.</p></section>`+days.map(d=>`<section class="card"><h2>${esc(d)}</h2><div class="list">${state.activities.filter(a=>a.day===d).map(a=>`<div class="item"><div class="row"><b>${esc(a.time)}</b><span>${visibleActivity(a)}</span></div>${(!a.public&&!canCrew()&&a.riddleVisible)?`<p>🔓 ${esc(a.riddle)}</p>`:''}${canCrew()?`<p class="muted">Gåta: ${a.riddleVisible?'Aktiv':'Dold'} · ${a.riddleMode==='relative'?(a.riddleAt||60)+' min innan':a.riddleAt?esc(a.riddleAt):'Manuell'}</p>`:''}</div>`).join('')}</div></section>`).join('')}
function feed(){let items=state.role==='nicole'?state.feed.filter(f=>f.nicole):state.feed; app.innerHTML=`<section class="card"><h2>${state.role==='nicole'?'Nicole HQ':'📰 Live Feed'}</h2><p>${state.role==='nicole'?'Senaste rapporter från Budapest. Reaktion: 🍺 endast.':'Resans kronologiska kaoslogg.'}</p></section><div class="list">${items.slice().reverse().map(feedCard).join('')}</div>`}
function feedCard(f){return `<div class="item feedItem"><div class="feedMeta"><span>${f.type} ${esc(f.author)}</span><span>${nowLabel(f.time)}</span></div>${f.img?`<img class="feedImg" src="${f.img}" alt="Feed-bild">`:''}<div>${esc(f.text)}</div>${state.role==='nicole'?'<button class="btn small">🍺</button>':''}</div>`}
function missions(){app.innerHTML=`<section class="card"><h2>🎯 Uppdrag</h2><div class="list">${state.missions.filter(m=>m.status==='Aktiv'||canGM()).map(m=>`<div class="item"><div class="row"><b>${esc(m.title)}</b><span class="pill">${m.points}p</span></div><p>${esc(m.desc)}</p><p class="muted">Status: ${esc(m.status)}</p></div>`).join('')}</div></section>`}
function score(){app.innerHTML=scorePreview()}
function gallery(){app.innerHTML=`<section class="card"><h2>📸 Galleri</h2><p>Här kopplar vi senare in Micke-bilderna och Budapest 2026-uppladdningar.</p><br><div class="grid two"><div class="mickePhoto">📸</div><div class="mickePhoto">🍺</div></div></section>`}
function crew(){app.innerHTML=`<section class="card hero"><h2>⚙️ Crew-panel</h2><p>Hantera feed, bilder, öl-larm och aktiviteter från mobilen.</p></section><section class="card"><h2>📰 Nytt Feed-inlägg</h2><div class="adminBox form"><div class="field"><label>Text</label><textarea id="feedText" class="textarea" placeholder="Situationen utvecklas..."></textarea></div><div class="field"><label>Bild, frivilligt</label><input id="feedImage" class="input" type="file" accept="image/*"></div><label class="check"><input id="feedNicole" type="checkbox" checked> Synlig i Nicole HQ</label><button class="btn primary" id="addFeed">Publicera</button></div></section><section class="card"><h2>🍺 Öl-larm</h2><button class="btn primary" id="beerBtn">Skicka öl-larm</button></section><section class="card"><h2>📅 Lägg till aktivitet</h2><div class="adminBox form"><div class="field"><label>Dag</label><input id="newDay" class="input" value="Fredag"></div><div class="field"><label>Tid</label><input id="newTime" class="input" placeholder="16:30"></div><div class="field"><label>Titel</label><input id="newTitle" class="input" placeholder="Hemlig aktivitet"></div><label class="check"><input id="newPublic" type="checkbox"> Synlig för Micke direkt</label><div class="field"><label>Gåta</label><textarea id="newRiddle" class="textarea" placeholder="Ledtråd till Micke..."></textarea></div><button class="btn primary" id="addActivity">Lägg till aktivitet</button></div></section><section class="card"><h2>📅 Aktiviteter</h2><div class="list">${state.activities.map(a=>activityEditor(a)).join('')}</div></section>`; bindCrew()}
function activityEditor(a){return `<div class="item"><b>${esc(a.title)}</b><div class="adminBox"><div class="grid two"><div class="field"><label>Dag</label><input class="input dayEdit" data-id="${a.id}" value="${esc(a.day)}"></div><div class="field"><label>Tid</label><input class="input timeEdit" data-id="${a.id}" value="${esc(a.time)}"></div></div><div class="field"><label>Titel</label><input class="input titleEdit" data-id="${a.id}" value="${esc(a.title)}"></div><label class="check"><input class="publicEdit" data-id="${a.id}" type="checkbox" ${a.public?'checked':''}> Synlig för Micke direkt</label><div class="field"><label>Gåta kopplad till aktiviteten</label><textarea class="textarea riddleText" data-id="${a.id}">${esc(a.riddle)}</textarea></div><label class="check"><input class="riddleEdit" data-id="${a.id}" type="checkbox" ${a.riddleVisible?'checked':''}> Gåta synlig nu</label><div class="grid two"><div class="field"><label>Gåta skickas</label><select class="select riddleMode" data-id="${a.id}"><option value="manual" ${a.riddleMode==='manual'?'selected':''}>Manuellt</option><option value="relative" ${a.riddleMode==='relative'?'selected':''}>Minuter innan</option><option value="exact" ${a.riddleMode==='exact'?'selected':''}>Exakt tid</option></select></div><div class="field"><label>Tid/minuter</label><input class="input riddleAt" data-id="${a.id}" value="${esc(a.riddleAt||'') }" placeholder="60 eller 15:30"></div></div><div class="actions"><button class="btn small saveAct" data-id="${a.id}">Spara</button><button class="btn small ok sendRiddle" data-id="${a.id}">Skicka gåta nu</button><button class="btn small danger delAct" data-id="${a.id}">Ta bort</button></div><p class="mini">Demo: schemaläggningen sparas här. I Firebase-versionen skickas notisen automatiskt.</p></div></div>`}
function fileToDataUrl(file){return new Promise((resolve,reject)=>{if(!file)return resolve(''); const r=new FileReader(); r.onload=()=>resolve(r.result); r.onerror=reject; r.readAsDataURL(file)})}
function bindCrew(){ $('addFeed').onclick=async()=>{let t=$('feedText').value.trim(); let img=await fileToDataUrl($('feedImage').files[0]); if(!t&&!img)return toast('Skriv något eller välj bild'); addFeed(img?'📸':'📢',labels[state.role],t||'Bild från Budapest',$('feedNicole').checked,img); save();toast('Publicerat');render()}; $('beerBtn').onclick=()=>{addFeed('🍺','Crew','För nyktert. Drick för fan.',true,'');save();toast('Öl-larm skickat');render()}; $('addActivity').onclick=()=>{let title=$('newTitle').value.trim(); if(!title)return toast('Titel saknas'); state.activities.push({id:Date.now(),day:$('newDay').value.trim()||'Fredag',time:$('newTime').value.trim()||'??:??',title,public:$('newPublic').checked,riddle:$('newRiddle').value.trim(),riddleVisible:false,riddleMode:'relative',riddleAt:'60'}); save();toast('Aktivitet tillagd');render()}; document.querySelectorAll('.saveAct').forEach(b=>b.onclick=()=>{let id=+b.dataset.id,a=state.activities.find(x=>x.id===id);a.day=document.querySelector(`.dayEdit[data-id="${id}"]`).value;a.time=document.querySelector(`.timeEdit[data-id="${id}"]`).value;a.title=document.querySelector(`.titleEdit[data-id="${id}"]`).value;a.public=document.querySelector(`.publicEdit[data-id="${id}"]`).checked;a.riddle=document.querySelector(`.riddleText[data-id="${id}"]`).value;a.riddleVisible=document.querySelector(`.riddleEdit[data-id="${id}"]`).checked;a.riddleMode=document.querySelector(`.riddleMode[data-id="${id}"]`).value;a.riddleAt=document.querySelector(`.riddleAt[data-id="${id}"]`).value;save();toast('Aktivitet sparad');render()}); document.querySelectorAll('.sendRiddle').forEach(b=>b.onclick=()=>{let a=state.activities.find(x=>x.id==b.dataset.id);a.riddleVisible=true;addFeed('🔓','Crew',`Gåta skickad: ${a.riddle}`,false,'');save();toast('Gåta skickad');render()}); document.querySelectorAll('.delAct').forEach(b=>b.onclick=()=>{state.activities=state.activities.filter(a=>a.id!=b.dataset.id);save();toast('Aktivitet borttagen');render()})}
function gm(){app.innerHTML=`<section class="card hero"><h2>🎮 Game Master</h2><p>Gabbes kontrollrum: skapa, ändra och ta bort.</p></section><section class="card"><h2>🎯 Uppdrag</h2><div class="adminBox form"><div class="field"><label>Titel</label><input id="mTitle" class="input" placeholder="Nytt uppdrag"></div><div class="field"><label>Beskrivning</label><textarea id="mDesc" class="textarea"></textarea></div><div class="field"><label>Poäng</label><input id="mPoints" class="input" type="number" value="10"></div><button class="btn primary" id="addMission">Skapa & publicera uppdrag</button></div><br><div class="list">${state.missions.map(m=>`<div class="item"><div class="row"><b>${esc(m.title)}</b><span>${m.points}p</span></div><p>${esc(m.desc)}</p><p class="muted">Status: ${esc(m.status)}</p><div class="actions"><button class="btn small toggleMission" data-id="${m.id}">${m.status==='Aktiv'?'Dölj':'Publicera'}</button><button class="btn small danger delMission" data-id="${m.id}">Ta bort</button></div></div>`).join('')}</div></section><section class="card"><h2>⚠️ Straff</h2><div class="adminBox form"><div class="field"><label>Titel</label><input id="pTitle" class="input" placeholder="Nytt straff"></div><div class="field"><label>Beskrivning</label><textarea id="pDesc" class="textarea"></textarea></div><button class="btn primary" id="addPunish">Skapa straff</button></div><br><div class="list">${state.punishments.map(p=>`<div class="item"><b>${esc(p.title)}</b><p>${esc(p.desc)}</p><div class="adminBox"><div class="field"><label>Vem får straffet?</label><select class="select punishTarget" data-id="${p.id}">${players.map(x=>`<option value="${x}">${x}</option>`).join('')}</select></div><div class="actions"><button class="btn small assignPunish" data-id="${p.id}">Utdela</button><button class="btn small danger delPunish" data-id="${p.id}">Ta bort</button></div></div></div>`).join('')}</div></section><section class="card"><h2>🏆 Poäng</h2><div class="list">${Object.keys(state.scores).map(n=>`<div class="item"><div class="row"><b>${n}</b><span>${state.scores[n]}p</span></div><div class="actions"><button class="btn small scoreBtn" data-n="${n}" data-v="5">+5</button><button class="btn small scoreBtn" data-n="${n}" data-v="10">+10</button><button class="btn small scoreBtn" data-n="${n}" data-v="20">+20</button><button class="btn small danger scoreBtn" data-n="${n}" data-v="-5">-5</button></div></div>`).join('')}</div></section>`; bindGM()}
function bindGM(){ $('addMission').onclick=()=>{let title=$('mTitle').value.trim(),desc=$('mDesc').value.trim(),points=+$('mPoints').value||0;if(!title)return toast('Titel saknas');state.missions.push({id:Date.now(),title,desc,points,status:'Aktiv'});addFeed('🎯','Game Master',`Nytt uppdrag: ${title} (${points} poäng)`,false,'');save();toast('Uppdrag skapat');render()}; $('addPunish').onclick=()=>{let title=$('pTitle').value.trim(),desc=$('pDesc').value.trim();if(!title)return toast('Titel saknas');state.punishments.push({id:Date.now(),title,desc,status:'Utkast'});save();toast('Straff sparat');render()}; document.querySelectorAll('.delMission').forEach(b=>b.onclick=()=>{state.missions=state.missions.filter(m=>m.id!=b.dataset.id);save();toast('Uppdrag borttaget');render()}); document.querySelectorAll('.toggleMission').forEach(b=>b.onclick=()=>{let m=state.missions.find(x=>x.id==b.dataset.id);m.status=m.status==='Aktiv'?'Utkast':'Aktiv'; if(m.status==='Aktiv') addFeed('🎯','Game Master',`Uppdrag publicerat: ${m.title} (${m.points} poäng)`,false,''); save();render()}); document.querySelectorAll('.delPunish').forEach(b=>b.onclick=()=>{state.punishments=state.punishments.filter(p=>p.id!=b.dataset.id);save();toast('Straff borttaget');render()}); document.querySelectorAll('.assignPunish').forEach(b=>b.onclick=()=>{let p=state.punishments.find(x=>x.id==b.dataset.id);let target=document.querySelector(`.punishTarget[data-id="${p.id}"]`).value;addFeed('⚠️','Game Master',`${target} har fått straffet: ${p.title}. ${p.desc}`,false,'');save();toast('Straff utdelat');render()}); document.querySelectorAll('.scoreBtn').forEach(b=>b.onclick=()=>{state.scores[b.dataset.n]+=+b.dataset.v;addFeed('🏆','Game Master',`${b.dataset.n} ${+b.dataset.v>0?'+':''}${b.dataset.v} poäng`,false,'');save();render()})}
window.vargenGo=p=>{state.page=p;save();render()};
$('roleBtn').onclick=()=>$('modal').classList.remove('hidden'); $('closeBtn').onclick=()=>$('modal').classList.add('hidden'); document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{state.role=b.dataset.role;state.page=state.role==='nicole'?'feed':'home';save();$('modal').classList.add('hidden');render()});
render();
})();
</script>
</body>
</html>
