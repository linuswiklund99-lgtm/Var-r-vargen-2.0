<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Var är Vargen?</title>
<style>
:root{--bg:#0d0e12;--card:#181a21;--card2:#222532;--text:#f7f1e7;--muted:#aaa39a;--gold:#d6b25e;--gold2:#f2d788;--red:#ff6b6b;--green:#6be39a;--border:rgba(255,255,255,.1)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#25202b 0,#0d0e12 42%);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}.app{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:90px}.top{position:sticky;top:0;z-index:5;background:rgba(13,14,18,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:16px}.eyebrow{color:var(--gold2);font-size:12px;text-transform:uppercase;letter-spacing:.18em;margin:0}.toprow{display:flex;justify-content:space-between;gap:12px;align-items:center}h1{font-size:24px;margin:2px 0 0}.btn{border:1px solid var(--border);background:var(--card2);color:var(--text);padding:10px 12px;border-radius:14px;font-weight:700;cursor:pointer}.btn.primary{background:linear-gradient(135deg,var(--gold),#8d6c25);color:#17130a;border:0}.btn.danger{background:#3a171a;color:#ffd5d5}.btn.small{font-size:12px;padding:7px 9px;border-radius:10px}.screen{padding:16px}.card{background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.02));border:1px solid var(--border);border-radius:22px;padding:16px;margin-bottom:14px;box-shadow:0 12px 35px rgba(0,0,0,.18)}.card h2,.card h3{margin:0 0 10px}.muted{color:var(--muted)}.big{font-size:28px;font-weight:900}.timer{font-size:34px;color:var(--gold2);font-weight:900}.grid{display:grid;gap:10px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.pill{display:inline-block;border:1px solid var(--border);border-radius:999px;padding:5px 9px;color:var(--gold2);font-size:12px;background:rgba(214,178,94,.09)}.feeditem{border-left:3px solid var(--gold);padding:10px 0 10px 12px;margin:6px 0}.feedmeta{font-size:12px;color:var(--muted)}.score{font-size:18px;font-weight:800}.nav{position:fixed;bottom:0;left:0;right:0;z-index:10;background:rgba(13,14,18,.96);border-top:1px solid var(--border);display:flex;justify-content:center}.navinner{max-width:520px;width:100%;display:grid;grid-template-columns:repeat(6,1fr);gap:2px;padding:8px}.nav button{background:transparent;border:0;color:var(--muted);padding:8px 2px;border-radius:12px;font-size:11px}.nav button.active{background:var(--card2);color:var(--gold2)}.heroimg{height:230px;border-radius:18px;background:linear-gradient(135deg,#3a2d15,#111);display:flex;align-items:center;justify-content:center;color:var(--gold2);font-size:46px;border:1px solid var(--border);overflow:hidden}.heroimg img{width:100%;height:100%;object-fit:cover}.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;z-index:30;padding:18px}.hidden{display:none}.modalcard{max-width:440px;width:100%;background:var(--card);border:1px solid var(--border);border-radius:24px;padding:18px}.roles{display:grid;grid-template-columns:1fr 1fr;gap:10px}input,textarea,select{width:100%;padding:12px;border-radius:14px;border:1px solid var(--border);background:#101219;color:var(--text);font:inherit}textarea{min-height:85px}.formrow{display:grid;gap:8px;margin:10px 0}.adminlist{display:grid;gap:10px}.adminitem{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:16px;padding:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--gold2);color:#15120a;padding:12px 16px;border-radius:999px;font-weight:900;z-index:40;box-shadow:0 12px 30px rgba(0,0,0,.3)}.nicole .top h1:after{content:' HQ';color:var(--gold2)}@media(max-width:420px){.navinner{grid-template-columns:repeat(6,1fr)}.top{padding:14px}.screen{padding:12px}.card{border-radius:18px}.timer{font-size:29px}.roles{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app" id="root">
<header class="top"><div class="toprow"><div><p class="eyebrow">Budapest 2026</p><h1>Var är Vargen?</h1></div><button class="btn small" id="roleBtn">Micke</button></div></header>
<main id="app" class="screen"></main>
<nav id="nav" class="nav"><div class="navinner" id="navinner"></div></nav>
</div>
<div id="modal" class="modal hidden"><div class="modalcard"><h2>Välj roll</h2><p class="muted">Demo-läge innan riktig inloggning.</p><div class="roles"><button class="btn primary" data-role="micke">Micke</button><button class="btn" data-role="crew">Crew</button><button class="btn" data-role="gabbe">Gabbe</button><button class="btn" data-role="nicole">Nicole HQ</button></div><br><button class="btn" id="closeBtn">Stäng</button></div></div>
<script>
(function(){
'use strict';
const STORE='vav-v03-state';
const defaultState={role:'micke',page:'home',scores:{Karl:75,Linus:72,Micke:68,Olle:66},activities:[{id:1,day:'Fredag',time:'04:30',title:'Hämtning i Örebro',secret:false,category:'🚗',riddle:''},{id:2,day:'Fredag',time:'08:00',title:'Flyg till Budapest',secret:false,category:'✈️',riddle:''},{id:3,day:'Fredag',time:'16:30',title:'Escape Room',secret:true,category:'🔒',riddle:'Du kommer bli instängd. Men frivilligt.',hint:false},{id:4,day:'Lördag',time:'11:00',title:'Proseccobåt',secret:true,category:'🥂',riddle:'Dagens transportmedel har ingen motorväg.',hint:false},{id:5,day:'Söndag',time:'19:30',title:'VM-final på sportbar',secret:true,category:'⚽',riddle:'Två lag. En vinnare. Miljoner experter.',hint:false}],feed:[{type:'📸',by:'Karl',text:'Micke tror fortfarande att vi är här för kulturen.',time:'Fredag 12:14',nicole:true},{type:'🍺',by:'Systemet',text:'För nyktert. Drick för fan.',time:'Fredag 14:02',nicole:true},{type:'🎯',by:'Game Master',text:'Nytt uppdrag aktiverat.',time:'Fredag 14:30',nicole:false}],missions:[{id:1,title:'Lär en främling svenska',desc:'Få en okänd person att säga: Jag heter Micke.',points:20,status:'active'}],punishments:[{id:1,title:'Turist-armhävningar',desc:'Gör 10 armhävningar framför närmaste turist.',cat:'Gata',status:'draft'}],images:['🐺','🍻','📸','🎩']};
let state=load();
function load(){try{return {...defaultState,...JSON.parse(localStorage.getItem(STORE)||'{}')}}catch(e){return JSON.parse(JSON.stringify(defaultState))}}
function save(){localStorage.setItem(STORE,JSON.stringify(state))}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1700)}
function canCrew(){return state.role==='crew'||state.role==='gabbe'}function isGabbe(){return state.role==='gabbe'}
function tabs(){if(state.role==='nicole')return [['feed','📰','Feed']];let a=[['home','🏠','Hem'],['schedule','📅','Schema'],['feed','📰','Feed'],['missions','🎯','Uppdrag'],['score','🏆','Poäng'],['gallery','📸','Galleri']];if(canCrew())a.push(['crew','⚙️','Crew']);if(isGabbe())a.push(['gm','🎮','GM']);return a}
function setRole(r){state.role=r;state.page=r==='nicole'?'feed':'home';save();document.body.classList.toggle('nicole',r==='nicole');render();}
function titleForActivity(a){if(state.role==='micke'&&a.secret)return a.hint?'🔒 Hemlig aktivitet':'🔒 Hemlig aktivitet';return `${a.category} ${a.title}`}
function renderNav(){document.getElementById('roleBtn').textContent={micke:'Micke',crew:'Crew',gabbe:'Gabbe',nicole:'Nicole HQ'}[state.role];const nav=document.getElementById('navinner');nav.innerHTML=tabs().map(t=>`<button class="${state.page===t[0]?'active':''}" data-page="${t[0]}"><div>${t[1]}</div><div>${t[2]}</div></button>`).join('');nav.querySelectorAll('button').forEach(b=>b.onclick=()=>{state.page=b.dataset.page;save();render()})}
function render(){renderNav();const app=document.getElementById('app');if(state.role==='nicole') app.innerHTML=feedPage(true); else if(state.page==='home') app.innerHTML=home(); else if(state.page==='schedule') app.innerHTML=schedule(); else if(state.page==='feed') app.innerHTML=feedPage(false); else if(state.page==='missions') app.innerHTML=missions(); else if(state.page==='score') app.innerHTML=score(); else if(state.page==='gallery') app.innerHTML=gallery(); else if(state.page==='crew') app.innerHTML=crew(); else if(state.page==='gm') app.innerHTML=gm(); bind();}
function nextAct(){return state.activities.find(a=>a.secret)||state.activities[0]}
function home(){const a=nextAct();return `<section class="card"><span class="pill">Nästa aktivitet</span><h2>${titleForActivity(a)}</h2>${a.hint?`<p class="muted">Ledtråd</p><p>${a.riddle}</p>`:''}<div class="timer">01:24 kvar</div><p class="muted">Tid kan ändras i Crew-panelen.</p></section>${feedPreview()}${scorePreview()}<section class="card"><h2>📸 Dagens Micke</h2><div class="heroimg">${state.images[Math.floor(Math.random()*state.images.length)]}</div><p><b>Status:</b> Under observation</p><p class="muted">Har ännu inte förstått omfattningen av helgen.</p></section>`}
function feedPreview(){return `<section class="card"><div class="row"><h2>📰 Senaste från Feed</h2><button class="btn small" data-goto="feed">Visa allt</button></div>${state.feed.slice(0,3).map(f=>feedItem(f)).join('')}</section>`}
function feedItem(f){return `<div class="feeditem"><b>${f.type} ${f.by}</b><div>${f.text}</div><div class="feedmeta">${f.time}${f.nicole?' · Nicole HQ':''}</div></div>`}
function feedPage(nicole){let items=nicole?state.feed.filter(f=>f.nicole):state.feed;return `<section class="card"><h2>${nicole?'Nicole HQ':'📰 Live Feed'}</h2><p class="muted">${nicole?'Senaste rapporter från Budapest. Reaktion: 🍺':'Kronologisk rese-logg.'}</p>${items.map(feedItem).join('')||'<p class="muted">Inga inlägg ännu.</p>'}</section>`}
function scorePreview(){return `<section class="card"><h2>🏆 Ställning</h2>${scoreRows().slice(0,4).map((r,i)=>`<div class="row"><span class="score">${['🥇','🥈','🥉','🍺'][i]} ${r[0]}</span><b>${r[1]} p</b></div>`).join('')}</section>`}
function scoreRows(){return Object.entries(state.scores).sort((a,b)=>b[1]-a[1])}
function schedule(){let days=[...new Set(state.activities.map(a=>a.day))];return days.map(day=>`<section class="card"><h2>${day}</h2>${state.activities.filter(a=>a.day===day).map(a=>`<div class="adminitem"><div class="row"><b>${a.time}</b><span>${titleForActivity(a)}</span></div>${state.role==='micke'&&a.hint?`<p class="muted">${a.riddle}</p>`:''}</div>`).join('')}</section>`).join('')}
function missions(){return `<section class="card"><h2>🎯 Uppdrag</h2>${state.missions.filter(m=>m.status==='active').map(m=>`<div class="adminitem"><h3>${m.title}</h3><p>${m.desc}</p><span class="pill">${m.points} poäng</span></div>`).join('')||'<p class="muted">Inga aktiva uppdrag.</p>'}</section>`}
function score(){return `<section class="card"><h2>🏆 Poängliga</h2>${scoreRows().map((r,i)=>`<div class="adminitem row"><span class="score">${i+1}. ${r[0]}</span><b>${r[1]} poäng</b></div>`).join('')}</section>`}
function gallery(){return `<section class="card"><h2>📸 Galleri</h2><p class="muted">Hall of Fame / Budapest 2026</p><div class="grid">${state.images.map(x=>`<div class="heroimg">${x}</div>`).join('')}</div></section>`}
function crew(){if(!canCrew())return '<section class="card"><h2>Ingen åtkomst</h2></section>';return `<section class="card"><h2>⚙️ Crew-panel</h2><div class="grid"><button class="btn primary" data-action="beer">🍺 Skicka öl-larm</button></div></section><section class="card"><h2>📰 Nytt feed-inlägg</h2><div class="formrow"><textarea id="feedText" placeholder="Situationen utvecklas..."></textarea></div><label><input id="feedNicole" type="checkbox"> Synlig för Nicole HQ</label><br><br><button class="btn primary" data-action="addFeed">Publicera</button></section><section class="card"><h2>📅 Aktiviteter</h2>${state.activities.map(a=>`<div class="adminitem"><b>${a.title}</b><p class="muted">${a.day} ${a.time}</p><div class="actions"><button class="btn small" data-hint="${a.id}">${a.hint?'Dölj gåta':'Aktivera gåta'}</button><button class="btn small" data-time="${a.id}">Ändra tid</button></div></div>`).join('')}</section>`}
function gm(){if(!isGabbe())return '<section class="card"><h2>Ingen åtkomst</h2></section>';return `<section class="card"><h2>🎮 Game Master</h2><p class="muted">Uppdrag och straff kan läggas till, redigeras och tas bort.</p></section><section class="card"><h2>🎯 Skapa uppdrag</h2><input id="mtitle" placeholder="Titel"><div class="formrow"><textarea id="mdesc" placeholder="Beskrivning"></textarea></div><input id="mpoints" type="number" value="10"><br><br><button class="btn primary" data-action="addMission">Lägg till uppdrag</button></section><section class="card"><h2>🎯 Uppdrag</h2>${state.missions.map(m=>`<div class="adminitem"><h3>${m.title}</h3><p>${m.desc}</p><span class="pill">${m.points} p · ${m.status}</span><div class="actions"><button class="btn small" data-pubm="${m.id}">${m.status==='active'?'Arkivera':'Publicera'}</button><button class="btn small danger" data-delm="${m.id}">Ta bort</button></div></div>`).join('')}</section><section class="card"><h2>⚠️ Straffbibliotek</h2><input id="ptitle" placeholder="Titel"><div class="formrow"><textarea id="pdesc" placeholder="Beskrivning"></textarea></div><button class="btn primary" data-action="addPunishment">Lägg till straff</button><br><br>${state.punishments.map(p=>`<div class="adminitem"><h3>${p.title}</h3><p>${p.desc}</p><span class="pill">${p.status}</span><div class="actions"><button class="btn small" data-assignp="${p.id}">Utdela</button><button class="btn small danger" data-delp="${p.id}">Ta bort</button></div></div>`).join('')}</section><section class="card"><h2>🏆 Snabbpoäng</h2>${Object.keys(state.scores).map(n=>`<div class="adminitem"><div class="row"><b>${n}</b><span>${state.scores[n]} p</span></div><div class="actions"><button class="btn small" data-score="${n}:5">+5</button><button class="btn small" data-score="${n}:10">+10</button><button class="btn small" data-score="${n}:-5">-5</button></div></div>`).join('')}</section>`}
function bind(){document.querySelectorAll('[data-goto]').forEach(b=>b.onclick=()=>{state.page=b.dataset.goto;save();render()});document.querySelectorAll('[data-action="beer"]').forEach(b=>b.onclick=()=>{state.feed.unshift({type:'🍺',by:'Systemet',text:'För nyktert. Drick för fan.',time:'Nu',nicole:true});save();toast('Öl-larm skickat');render()});document.querySelectorAll('[data-action="addFeed"]').forEach(b=>b.onclick=()=>{let t=document.getElementById('feedText').value.trim();if(!t)return;state.feed.unshift({type:'📢',by:state.role==='gabbe'?'Gabbe':'Crew',text:t,time:'Nu',nicole:document.getElementById('feedNicole').checked});save();toast('Publicerat');render()});document.querySelectorAll('[data-hint]').forEach(b=>b.onclick=()=>{let a=state.activities.find(x=>x.id==b.dataset.hint);a.hint=!a.hint;save();render()});document.querySelectorAll('[data-time]').forEach(b=>b.onclick=()=>{let a=state.activities.find(x=>x.id==b.dataset.time);let t=prompt('Ny tid, t.ex. 17:15',a.time);if(t){a.time=t;save();render()}});document.querySelectorAll('[data-action="addMission"]').forEach(b=>b.onclick=()=>{let title=document.getElementById('mtitle').value.trim();if(!title)return;state.missions.push({id:Date.now(),title,desc:document.getElementById('mdesc').value.trim(),points:+document.getElementById('mpoints').value||0,status:'draft'});save();render()});document.querySelectorAll('[data-pubm]').forEach(b=>b.onclick=()=>{let m=state.missions.find(x=>x.id==b.dataset.pubm);m.status=m.status==='active'?'archived':'active';if(m.status==='active')state.feed.unshift({type:'🎯',by:'Game Master',text:'Nytt uppdrag: '+m.title,time:'Nu',nicole:false});save();render()});document.querySelectorAll('[data-delm]').forEach(b=>b.onclick=()=>{if(confirm('Ta bort uppdrag?')){state.missions=state.missions.filter(x=>x.id!=b.dataset.delm);save();render()}});document.querySelectorAll('[data-action="addPunishment"]').forEach(b=>b.onclick=()=>{let title=document.getElementById('ptitle').value.trim();if(!title)return;state.punishments.push({id:Date.now(),title,desc:document.getElementById('pdesc').value.trim(),cat:'Valfri',status:'draft'});save();render()});document.querySelectorAll('[data-delp]').forEach(b=>b.onclick=()=>{if(confirm('Ta bort straff?')){state.punishments=state.punishments.filter(x=>x.id!=b.dataset.delp);save();render()}});document.querySelectorAll('[data-assignp]').forEach(b=>b.onclick=()=>{let p=state.punishments.find(x=>x.id==b.dataset.assignp);state.feed.unshift({type:'⚠️',by:'Game Master',text:'Straff utdelat: '+p.title,time:'Nu',nicole:false});toast('Straff utdelat');save();render()});document.querySelectorAll('[data-score]').forEach(b=>b.onclick=()=>{let [n,v]=b.dataset.score.split(':');state.scores[n]+=+v;state.feed.unshift({type:'🏆',by:'Game Master',text:`${n} ${+v>0?'+':''}${v} poäng`,time:'Nu',nicole:false});save();render()})}
document.getElementById('roleBtn').onclick=()=>document.getElementById('modal').classList.remove('hidden');document.getElementById('closeBtn').onclick=()=>document.getElementById('modal').classList.add('hidden');document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{setRole(b.dataset.role);document.getElementById('modal').classList.add('hidden')});document.body.classList.toggle('nicole',state.role==='nicole');render();
})();
</script>
</body>
</html>
