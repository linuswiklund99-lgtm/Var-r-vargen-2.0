<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Var är Vargen?</title>
  <style>
    :root{--bg:#0d0e12;--card:#181a21;--card2:#222532;--text:#f7f1e7;--muted:#aaa39a;--gold:#d6b25e;--gold2:#f2d788;--border:rgba(255,255,255,.1);--danger:#ff6b6b;--ok:#7bd88f}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#25202b 0,#0d0e12 38%,#08090c 100%);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:520px;margin:0 auto;min-height:100vh;padding:18px 14px 92px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:16px}.eyebrow{color:var(--gold2);letter-spacing:.12em;text-transform:uppercase;font-size:11px;margin:0 0 2px}h1{font-size:25px;margin:0}.userbox{text-align:right;font-size:12px;color:var(--muted)}.card{background:linear-gradient(180deg,var(--card),#12141b);border:1px solid var(--border);border-radius:22px;padding:16px;margin:12px 0;box-shadow:0 18px 50px rgba(0,0,0,.25)}.card h2,.card h3{margin:0 0 10px}.muted{color:var(--muted)}.small{font-size:12px}.btn{border:1px solid var(--border);background:var(--card2);color:var(--text);border-radius:14px;padding:10px 12px;font-weight:700;cursor:pointer}.btn.primary{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#15100a;border:0}.btn.danger{background:rgba(255,107,107,.12);color:#ffb2b2}.btn.ghost{background:transparent}.btn.full{width:100%;margin-top:8px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.grid{display:grid;gap:8px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}input,textarea,select{width:100%;background:#0f1118;color:var(--text);border:1px solid var(--border);border-radius:14px;padding:11px;margin:5px 0 9px;font:inherit}textarea{min-height:86px;resize:vertical}.nav{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);width:min(520px,calc(100% - 20px));background:rgba(16,17,23,.95);backdrop-filter:blur(18px);border:1px solid var(--border);border-radius:24px;padding:8px;display:flex;gap:4px;z-index:5}.nav button{flex:1;background:transparent;border:0;color:var(--muted);font-size:11px;padding:8px 4px;border-radius:16px;cursor:pointer}.nav button.active{background:var(--card2);color:var(--gold2)}.feedpost{border-left:3px solid var(--gold);padding:10px 0 10px 12px;border-bottom:1px solid var(--border)}.feedpost:last-child{border-bottom:0}.pill{display:inline-flex;align-items:center;gap:4px;background:rgba(214,178,94,.12);color:var(--gold2);border:1px solid rgba(214,178,94,.25);padding:4px 8px;border-radius:999px;font-size:12px}.score{display:flex;justify-content:space-between;padding:10px;border-bottom:1px solid var(--border)}.score:last-child{border-bottom:0}.hidden{display:none!important}.activity{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--border)}.activity:last-child{border-bottom:0}.notice{background:rgba(214,178,94,.1);border:1px solid rgba(214,178,94,.28);padding:10px;border-radius:14px}.shame{height:180px;border-radius:20px;background:linear-gradient(135deg,#2b2731,#16171d);display:grid;place-items:center;color:var(--gold2);font-weight:900;font-size:46px}.status{font-size:12px;color:var(--muted)}.login{min-height:100vh;display:grid;place-items:center;padding:22px}.loginbox{max-width:420px;width:100%}.error{color:#ffb2b2;font-size:13px}.success{color:#b6f5c1;font-size:13px}.divider{height:1px;background:var(--border);margin:14px 0}.draft{opacity:.78;border-left-color:#777}.tag{font-size:11px;text-transform:uppercase;color:#bbb;letter-spacing:.08em}.collapse>button{width:100%;display:flex;justify-content:space-between;align-items:center}.collapseBody{margin-top:10px}.emoji{display:inline-flex;border-radius:99px;background:#252836;border:1px solid var(--border);padding:3px 8px;margin:4px 4px 0 0}
  </style>
</head>
<body>
  <div id="login" class="login">
    <div class="card loginbox">
      <p class="eyebrow">Budapest 2026</p>
      <h1>Var är Vargen?</h1>
      <p class="muted">Logga in med kontot du skapade i Firebase.</p>
      <label>E-post</label><input id="email" type="email" placeholder="linus@vararvargen.se" />
      <label>Lösenord</label><input id="password" type="password" placeholder="••••••••" />
      <button class="btn primary full" id="loginBtn">Logga in</button>
      <p id="loginMsg" class="error"></p>
    </div>
  </div>

  <div id="root" class="app hidden">
    <header class="top">
      <div><p class="eyebrow">Budapest 2026</p><h1>Var är Vargen?</h1></div>
      <div class="userbox"><div id="who"></div><button class="btn ghost" id="logoutBtn">Logga ut</button></div>
    </header>
    <main id="app"></main>
    <nav id="nav" class="nav"></nav>
  </div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import { getFirestore, collection, addDoc, doc, setDoc, deleteDoc, onSnapshot, query, orderBy, serverTimestamp, updateDoc, getDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyClYJkGbaz_H0qDSoaeUXBYiSfJ7JY-0Zk",
  authDomain: "var-ar-vargen-d69ab.firebaseapp.com",
  projectId: "var-ar-vargen-d69ab",
  storageBucket: "var-ar-vargen-d69ab.firebasestorage.app",
  messagingSenderId: "302114756240",
  appId: "1:302114756240:web:5b174a9efd1a87cecf6a15"
};

const appFb = initializeApp(firebaseConfig);
const auth = getAuth(appFb);
const db = getFirestore(appFb);

const $ = (id)=>document.getElementById(id);
let user=null, profile=null, page='home';
let data={activities:[],feed:[],missions:[],punishments:[],scores:[]};
const players=['Linus','Olle','Karl','Micke'];
const roleByEmail={
  'linus@vararvargen.se':{name:'Linus',role:'crew'},
  'olle@vararvargen.se':{name:'Olle',role:'crew'},
  'karl@vararvargen.se':{name:'Karl',role:'crew'},
  'gabbe@vararvargen.se':{name:'Gabbe',role:'crew'},
  'micke@vararvargen.se':{name:'Micke',role:'micke'}
};
const isCrew=()=>profile?.role==='crew';

$('loginBtn').onclick=async()=>{try{$('loginMsg').textContent='';await signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value)}catch(e){$('loginMsg').textContent='Kunde inte logga in: '+e.message}};
$('logoutBtn').onclick=()=>signOut(auth);

onAuthStateChanged(auth, async (u)=>{
  user=u;
  if(!u){$('login').classList.remove('hidden');$('root').classList.add('hidden');return}
  profile=roleByEmail[u.email]||{name:u.email,role:'micke'};
  $('login').classList.add('hidden');$('root').classList.remove('hidden');$('who').textContent=profile.name+' · '+(isCrew()?'Crew':'Micke');
  await ensureSeed();
  listenAll();
  render();
});

async function ensureSeed(){
  const flag=await getDoc(doc(db,'settings','seed'));
  if(flag.exists()) return;
  await setDoc(doc(db,'settings','seed'),{done:true,createdAt:serverTimestamp()});
  await Promise.all([
    addDoc(collection(db,'activities'),{title:'Hämtning i Örebro',day:'Fredag',time:'04:30',secret:false,riddle:'',riddleVisible:false,riddleSchedule:'',createdAt:serverTimestamp()}),
    addDoc(collection(db,'activities'),{title:'Flyg till Budapest',day:'Fredag',time:'08:00',secret:false,riddle:'',riddleVisible:false,riddleSchedule:'',createdAt:serverTimestamp()}),
    addDoc(collection(db,'activities'),{title:'Escape Room',day:'Fredag',time:'16:30',secret:true,riddle:'Du kommer bli instängd. Men frivilligt.',riddleVisible:false,riddleSchedule:'60',createdAt:serverTimestamp()}),
    addDoc(collection(db,'activities'),{title:'Proseccobåt',day:'Lördag',time:'11:00',secret:true,riddle:'Dagens transportmedel har ingen motorväg.',riddleVisible:false,riddleSchedule:'60',createdAt:serverTimestamp()}),
    addDoc(collection(db,'activities'),{title:'VM-final på sportbar',day:'Söndag',time:'19:30',secret:true,riddle:'Två lag. En vinnare. Miljarder experter.',riddleVisible:false,riddleSchedule:'60',createdAt:serverTimestamp()}),
    addDoc(collection(db,'feedPosts'),{type:'info',text:'Backenden är igång. Operationen kan börja.',author:'System',visible:true,createdAt:serverTimestamp()}),
    ...players.map(p=>setDoc(doc(db,'scores',p),{name:p,points:0,updatedAt:serverTimestamp()}))
  ]);
}
function listenAll(){
  onSnapshot(query(collection(db,'activities')),snap=>{data.activities=snap.docs.map(d=>({id:d.id,...d.data()}));render()});
  onSnapshot(query(collection(db,'feedPosts'),orderBy('createdAt','desc')),snap=>{data.feed=snap.docs.map(d=>({id:d.id,...d.data()}));render()});
  onSnapshot(query(collection(db,'missions')),snap=>{data.missions=snap.docs.map(d=>({id:d.id,...d.data()}));render()});
  onSnapshot(query(collection(db,'punishments')),snap=>{data.punishments=snap.docs.map(d=>({id:d.id,...d.data()}));render()});
  onSnapshot(query(collection(db,'scores')),snap=>{data.scores=snap.docs.map(d=>({id:d.id,...d.data()}));render()});
}
function navItems(){let base=[['home','🏠','Hem'],['schedule','📅','Schema'],['feed','📰','Feed'],['missions','🎯','Uppdrag'],['score','🏆','Poäng'],['gallery','📸','Galleri']];return base}
function renderNav(){ $('nav').innerHTML=navItems().map(([id,ico,label])=>`<button class="${page===id?'active':''}" data-page="${id}">${ico}<br>${label}</button>`).join(''); document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()})}
function render(){ if(!user) return; renderNav(); const a=$('app'); if(page==='home') a.innerHTML=home(); if(page==='schedule') a.innerHTML=schedule(); if(page==='feed') a.innerHTML=feed(); if(page==='missions') a.innerHTML=missions(); if(page==='score') a.innerHTML=score(); if(page==='gallery') a.innerHTML=gallery(); bind(); }
function sortedActs(){const order={Fredag:1,Lördag:2,Söndag:3,Måndag:4};return [...data.activities].sort((a,b)=>(order[a.day]||9)-(order[b.day]||9)||String(a.time).localeCompare(String(b.time)))}
function visibleTitle(act){ if(!act.secret||isCrew()||act.riddleVisible) return act.title; return '🔒 Hemlig aktivitet'}
function home(){const next=sortedActs()[0];return `<section class="card"><h2>Nästa aktivitet</h2>${next?`<h3>${visibleTitle(next)}</h3><p class="muted">${next.day} ${next.time}</p>${next.riddleVisible?`<div class="notice"><b>Ledtråd</b><br>${next.riddle}</div>`:''}`:'<p>Inga aktiviteter.</p>'}</section><section class="card"><h2>Senaste från feed</h2>${data.feed.slice(0,3).map(postHtml).join('')||'<p class="muted">Tomt.</p>'}</section><section class="card"><h2>Poängställning</h2>${scoreList()}</section><section class="card"><h2>Dagens Micke</h2><div class="shame">🤦</div><p class="muted">Status: misstänkt självsäker.</p></section>`}
function schedule(){return `<section class="card"><h2>Schema</h2>${isCrew()?newActivityForm():''}${sortedActs().map(act=>`<div class="activity"><div><b>${visibleTitle(act)}</b><div class="muted small">${act.day} ${act.time}</div>${(act.riddleVisible||isCrew())&&act.riddle?`<div class="notice small"><b>Gåta:</b> ${act.riddle}</div>`:''}${isCrew()?`<div class="small muted">Gåta skickas: ${act.riddleSchedule||'ej satt'} ${act.riddleSchedule&&/^\d+$/.test(act.riddleSchedule)?'min innan':''}</div>`:''}</div>${isCrew()?`<div class="grid"><button class="btn" data-send-riddle="${act.id}">Skicka gåta</button><button class="btn danger" data-del-activity="${act.id}">Ta bort</button></div>`:''}</div>`).join('')}</section>`}
function newActivityForm(){return `<div class="collapse card"><button class="btn" id="toggleAct">▼ Ny aktivitet</button><div id="actForm" class="collapseBody hidden"><input id="aTitle" placeholder="Titel"><div class="grid2"><select id="aDay"><option>Fredag</option><option>Lördag</option><option>Söndag</option><option>Måndag</option></select><input id="aTime" placeholder="16:30"></div><textarea id="aRiddle" placeholder="Gåta"></textarea><input id="aSchedule" placeholder="Gåta: 60 eller 15:30"><label><input id="aSecret" type="checkbox" checked style="width:auto"> Hemlig för Micke</label><button class="btn primary full" id="createAct">Skapa aktivitet</button></div></div>`}
function feed(){return `<section class="card"><h2>Feed</h2><div class="collapse"><button class="btn" id="togglePost">▼ Skapa inlägg</button><div id="postForm" class="collapseBody hidden"><textarea id="postText" placeholder="Skriv något... bilder kommer i nästa fas"></textarea><button class="btn primary full" id="createPost">Publicera</button></div></div><div class="divider"></div>${data.feed.map(postHtml).join('')||'<p class="muted">Tomt.</p>'}</section>`}
function postHtml(p){const d=p.createdAt?.toDate?p.createdAt.toDate():null;const t=d?d.toLocaleString('sv-SE',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'nu';return `<div class="feedpost"><div class="tag">${p.type||'feed'} · ${t}</div><b>${p.author||'Okänd'}</b><p>${escapeHtml(p.text||'')}</p>${p.points?`<span class="pill">${p.points} poäng</span>`:''}${p.target?`<span class="pill">Till: ${p.target}</span>`:''}</div>`}
function missions(){const visible=data.missions.filter(m=>m.status==='published'||m.createdBy===profile.name);return `<section class="card"><h2>Uppdrag</h2>${isCrew()?missionForms():''}${visible.map(m=>`<div class="feedpost ${m.status!=='published'?'draft':''}"><div class="tag">${m.status==='published'?'Publicerat':'Utkast · bara du ser'}</div><b>${m.title}</b><p>${m.description||''}</p><span class="pill">${m.points||0} poäng</span>${isCrew()?`<div class="row" style="margin-top:8px">${m.status!=='published'?`<button class="btn primary" data-publish-mission="${m.id}">Publicera</button>`:''}<button class="btn danger" data-del-mission="${m.id}">Ta bort</button></div>`:''}</div>`).join('')||'<p class="muted">Inga uppdrag ännu.</p>'}<div class="divider"></div><h3>Straff</h3>${data.punishments.filter(p=>p.status==='published'||p.createdBy===profile.name).map(p=>`<div class="feedpost ${p.status!=='published'?'draft':''}"><div class="tag">${p.status==='published'?'Publicerat':'Utkast'}</div><b>${p.title}</b><p>${p.description||''}</p>${p.target?`<span class="pill">${p.target}</span>`:''}${isCrew()?`<div class="row" style="margin-top:8px">${p.status!=='published'?`<button class="btn primary" data-publish-punishment="${p.id}">Publicera</button>`:''}<button class="btn danger" data-del-punishment="${p.id}">Ta bort</button></div>`:''}</div>`).join('')||'<p class="muted">Inga straff ännu.</p>'}</section>`}
function missionForms(){return `<div class="collapse"><button class="btn" id="toggleMission">▼ Nytt uppdrag</button><div id="missionForm" class="collapseBody hidden"><input id="mTitle" placeholder="Titel"><textarea id="mDesc" placeholder="Beskrivning"></textarea><input id="mPoints" type="number" placeholder="Poäng"><button class="btn primary full" id="createMission">Spara som utkast</button></div></div><div class="collapse" style="margin-top:8px"><button class="btn" id="togglePunishment">▼ Nytt straff</button><div id="punishmentForm" class="collapseBody hidden"><input id="pTitle" placeholder="Titel"><textarea id="pDesc" placeholder="Beskrivning"></textarea><select id="pTarget"><option>Linus</option><option>Olle</option><option>Karl</option><option>Micke</option></select><button class="btn primary full" id="createPunishment">Spara som utkast</button></div></div><div class="divider"></div>`}
function score(){return `<section class="card"><h2>Poäng</h2>${scoreList()}${isCrew()?`<div class="divider"></div><h3>Justera poäng</h3><select id="scorePlayer">${players.map(p=>`<option>${p}</option>`).join('')}</select><div class="grid2"><button class="btn" data-score="5">+5</button><button class="btn" data-score="10">+10</button><button class="btn" data-score="20">+20</button><button class="btn danger" data-score="-5">-5</button></div>`:''}</section>`}
function scoreList(){let arr=[...data.scores]; if(arr.length===0) arr=players.map(p=>({name:p,points:0})); arr.sort((a,b)=>(b.points||0)-(a.points||0));return arr.map((s,i)=>`<div class="score"><span>${['🥇','🥈','🥉','🍺'][i]||'•'} ${s.name}</span><b>${s.points||0}</b></div>`).join('')}
function gallery(){return `<section class="card"><h2>Budapest 2026</h2><p class="muted">Bilduppladdning kommer i bildfasen när vi valt gratis lösning/Storage.</p></section><section class="card"><h2>Hall of Shame</h2><div class="shame">🤦</div><p class="muted">Rullande Micke-bilder kopplas in senare.</p></section>`}
function bind(){
  const toggle=(id,body)=>{const b=$(id); if(b)b.onclick=()=>$(body).classList.toggle('hidden')}; toggle('togglePost','postForm'); toggle('toggleAct','actForm'); toggle('toggleMission','missionForm'); toggle('togglePunishment','punishmentForm');
  const cp=$('createPost'); if(cp) cp.onclick=async()=>{const text=$('postText').value.trim(); if(!text)return; await addDoc(collection(db,'feedPosts'),{type:'feed',text,author:profile.name,createdAt:serverTimestamp()});$('postText').value='';$('postForm').classList.add('hidden')};
  const ca=$('createAct'); if(ca) ca.onclick=async()=>{await addDoc(collection(db,'activities'),{title:$('aTitle').value||'Ny aktivitet',day:$('aDay').value,time:$('aTime').value||'00:00',secret:$('aSecret').checked,riddle:$('aRiddle').value,riddleVisible:false,riddleSchedule:$('aSchedule').value,createdBy:profile.name,createdAt:serverTimestamp()});};
  document.querySelectorAll('[data-del-activity]').forEach(b=>b.onclick=()=>deleteDoc(doc(db,'activities',b.dataset.delActivity)));
  document.querySelectorAll('[data-send-riddle]').forEach(b=>b.onclick=async()=>{const act=data.activities.find(x=>x.id===b.dataset.sendRiddle); if(!act)return; await updateDoc(doc(db,'activities',act.id),{riddleVisible:true}); await addDoc(collection(db,'feedPosts'),{type:'gåta',text:`Ny ledtråd: ${act.riddle}`,author:'Crew',createdAt:serverTimestamp()})});
  const cm=$('createMission'); if(cm) cm.onclick=async()=>{await addDoc(collection(db,'missions'),{title:$('mTitle').value||'Nytt uppdrag',description:$('mDesc').value,points:Number($('mPoints').value||0),status:'draft',createdBy:profile.name,createdAt:serverTimestamp()});};
  const cpun=$('createPunishment'); if(cpun) cpun.onclick=async()=>{await addDoc(collection(db,'punishments'),{title:$('pTitle').value||'Nytt straff',description:$('pDesc').value,target:$('pTarget').value,status:'draft',createdBy:profile.name,createdAt:serverTimestamp()});};
  document.querySelectorAll('[data-publish-mission]').forEach(b=>b.onclick=async()=>{const m=data.missions.find(x=>x.id===b.dataset.publishMission); await updateDoc(doc(db,'missions',m.id),{status:'published'}); await addDoc(collection(db,'feedPosts'),{type:'uppdrag',text:`Nytt uppdrag: ${m.title}`,points:m.points||0,author:profile.name,createdAt:serverTimestamp()})});
  document.querySelectorAll('[data-del-mission]').forEach(b=>b.onclick=()=>deleteDoc(doc(db,'missions',b.dataset.delMission)));
  document.querySelectorAll('[data-publish-punishment]').forEach(b=>b.onclick=async()=>{const p=data.punishments.find(x=>x.id===b.dataset.publishPunishment); await updateDoc(doc(db,'punishments',p.id),{status:'published'}); await addDoc(collection(db,'feedPosts'),{type:'straff',text:`Straff: ${p.title}`,target:p.target,author:profile.name,createdAt:serverTimestamp()})});
  document.querySelectorAll('[data-del-punishment]').forEach(b=>b.onclick=()=>deleteDoc(doc(db,'punishments',b.dataset.delPunishment)));
  document.querySelectorAll('[data-score]').forEach(b=>b.onclick=async()=>{const name=$('scorePlayer').value; const delta=Number(b.dataset.score); const current=data.scores.find(s=>s.name===name)?.points||0; await setDoc(doc(db,'scores',name),{name,points:current+delta,updatedAt:serverTimestamp()}); await addDoc(collection(db,'feedPosts'),{type:'poäng',text:`${name} ${delta>0?'+':''}${delta} poäng`,author:profile.name,createdAt:serverTimestamp()})});
}
function escapeHtml(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
</script>
</body>
</html>
