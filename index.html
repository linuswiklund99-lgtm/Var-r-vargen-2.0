function listen(){onSnapshot(query(collection(db,'activities')),s=>{data.activities=s.docs.map(d=>({id:d.id,...d.data()})); scheduleRender()});onSnapshot(query(collection(db,'feedPosts'),orderBy('createdAt','desc')),s=>{const posts=s.docs.map(d=>({id:d.id,...d.data()})); if(!feedInitialLoad){posts.slice().reverse().forEach(p=>{if(!feedSeenIds.has(p.id)){feedSeenIds.add(p.id); if(isImportantPost(p) && postIsForCurrentUser(p) && (p.createdBy!==name || p.type==='beer')) showToast(p);}});} else {posts.forEach(p=>feedSeenIds.add(p.id)); feedInitialLoad=false;} data.feedPosts=posts; scheduleRender()});onSnapshot(query(collection(db,'missions')),s=>{data.missions=s.docs.map(d=>({id:d.id,...d.data()})); scheduleRender()});onSnapshot(query(collection(db,'punishments')),s=>{data.punishments=s.docs.map(d=>({id:d.id,...d.data()})); scheduleRender()});onSnapshot(collection(db,'scores'),s=>{let o={};s.docs.forEach(d=>o[d.id]=d.data().points||0);data.scores=o;scheduleRender()});onSnapshot(query(collection(db,'scoreEvents'),orderBy('createdAt','desc')),s=>{data.scoreEvents=s.docs.map(d=>({id:d.id,...d.data()}));scheduleRender()});onSnapshot(query(collection(db,'galleryImages'),orderBy('createdAt','desc')),s=>{data.galleryImages=s.docs.map(d=>({id:d.id,...d.data()})); scheduleRender()});}
function isImportantPost(p){return ['beer','riddle','mission','punishment'].includes(p.type)}
function toastTitle(p){if(p.type==='beer')return '🍺 ÖL-LARM'; if(p.type==='riddle')return '🔓 Ny ledtråd'; if(p.type==='mission')return '🎯 Nytt uppdrag'; if(p.type==='punishment')return '⚠️ Straff utdelat'; return '🔔 Ny händelse'}
function peopleList(x){const arr=x?.targets||x?.participants||(x?.target?[x.target]:[]);return Array.isArray(arr)?arr.filter(Boolean):[]}
function peopleText(arr){return (arr||[]).join(', ')}
function toastText(p){if(p.type==='mission')return p.title||p.text||''; if(p.type==='punishment'){const who=peopleText(peopleList(p));return `${who? who+' · ':''}${p.description||p.text||p.title||''}`;} if(p.type==='beer')return p.text||'Öl-larm utlöst.'; return p.summary||p.text||p.title||''}
function showToast(p){const wrap=$('toastWrap'); if(!wrap)return; const el=document.createElement('div'); el.className='toast'; el.innerHTML=`<h3>${esc(toastTitle(p))}</h3><p>${esc(toastText(p))}</p>${p.imageUrl?`<img class="toastImg" src="${esc(p.imageUrl)}" alt="Notisbild">`:''}`; wrap.prepend(el); setTimeout(()=>{el.style.opacity='0'; el.style.transform='translateY(-8px)'; setTimeout(()=>el.remove(),250)},6200)}
function visibleFeedPosts(){return data.feedPosts.filter(p=>!['missionScore','punishmentScore'].includes(p.type))}
function importantPosts(){return data.feedPosts.filter(p=>isImportantPost(p)&&postIsForCurrentUser(p)).slice(0,12)}
function updateNotifButton(){const b=$('notifBtn'); if(!b)return; const n=importantPosts().length; b.textContent=`🔔 ${n}`}
function updatePushButton(){const b=$('pushBtn'); if(!b)return; if(!('Notification' in window)){b.textContent='🔔 Aktivera'; return;} if(Notification.permission==='granted'&&pushEnabled){b.textContent='✅ Notiser'; return;} if(Notification.permission==='denied'){b.textContent='🚫 Notiser'; return;} b.textContent='🔔 Aktivera';}

function nextAct(){return sortActivities(data.activities)[0]}
async function uploadImage(file, folder='budapest-2026'){
 if(!file) return null;
 const fd=new FormData();
 fd.append('file',file);
 fd.append('upload_preset',CLOUD_PRESET);
 fd.append('folder',folder);
 const res=await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`,{method:'POST',body:fd});
 if(!res.ok){const txt=await res.text(); throw new Error('Bilduppladdning misslyckades: '+txt);}
 const json=await res.json();
 return {url:json.secure_url,publicId:json.public_id,width:json.width,height:json.height};
}
function downloadUrl(url){return url||'#'}
async function smartSaveImage(url){
  if(!url)return;
  const clean=String(url).startsWith('beer/')?String(url).replace('beer/',''):String(url);
  try{
    const res=await fetch(clean,{mode:'cors'});
    if(!res.ok) throw new Error('Kunde inte hämta bilden');
    const blob=await res.blob();
    const objectUrl=URL.createObjectURL(blob);
    const a=document.createElement('a');
    const ext=(blob.type&&blob.type.includes('png'))?'png':'jpg';
    a.href=objectUrl;
    a.download=`var-ar-vargen-bild.${ext}`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(objectUrl),1200);
  }catch(e){
    window.open(clean,'_blank');
  }
}
function imgTag(url,alt='Bild'){if(!url)return ''; const fixed=String(url).startsWith('beer/')?String(url).replace('beer/',''):String(url); return `<img class="feedImg" src="${esc(fixed)}" alt="${esc(alt)}" loading="lazy">`}
function randomItem(arr){return arr.length?arr[Math.floor(Math.random()*arr.length)]:null}

function applyTheme(theme){
  const t=theme==='light'?'light':'dark';
  document.body.setAttribute('data-theme',t);
  try{localStorage.setItem('vargenTheme',t)}catch(e){}
  updateThemeButton();
}

function toggleTheme(){const t=document.body.getAttribute('data-theme')==='light'?'dark':'light'; applyTheme(t)}

function actView(a,compact=false){
 if(!a)return '<p class="muted">Ingen aktivitet.</p>';
 const hidden=!isCrew()&&a.secret;
 const title=hidden?'🔒 Hemlig aktivitet':esc(a.title);
 let meta='';
 if(hidden){
   const showDate=a.showDateToMicke!==false;
   const showTime=a.showTimeToMicke!==false;
   const parts=[]; if(showDate&&a.date)parts.push(esc(a.date)); if(showTime&&a.time)parts.push(esc(a.time));
   meta=parts.length?`<p class="muted">${parts.join(' · ')}</p>`:'';
 }else{
   const parts=[]; if(a.date)parts.push(esc(a.date)); if(a.time)parts.push(esc(a.time));
   meta=parts.length?`<p class="muted">${parts.join(' · ')}</p>`:'';
 }
 return `<div class="between"><div><h3>${title}</h3>${meta}${(!hidden&&a.riddle)?`<p><b>Gåta:</b> ${esc(a.riddle)}</p>`:''}</div>${isCrew()&&!compact?`<span class="pill">${a.secret?'Hemlig':'Synlig'}</span>`:''}</div>`
}

function activityActions(a){const showDate=a.showDateToMicke!==false, showTime=a.showTimeToMicke!==false;return `<div class="actions"><button class="btn small" data-edit-act="${a.id}">✏️ Redigera</button><button class="btn small" data-send-riddle="${a.id}">Skicka gåta</button><button class="btn small" data-dup-act="${a.id}">Duplicera</button><button class="btn danger small" data-del-act="${a.id}">Ta bort</button></div><div id="edit-${a.id}" class="panel"><input class="input" id="t-${a.id}" value="${esc(a.title)}"><div class="grid"><input class="input" id="d-${a.id}" type="date" value="${esc(a.date||'')}"><input class="input" id="tm-${a.id}" type="time" value="${esc(a.time||'')}"></div><textarea class="input" id="r-${a.id}">${esc(a.riddle||'')}</textarea><select class="input" id="s-${a.id}"><option value="true" ${a.secret?'selected':''}>Hemlig</option><option value="false" ${!a.secret?'selected':''}>Synlig</option></select><select class="input" id="rm-${a.id}"><option value="manual" ${a.riddleMode==='manual'?'selected':''}>Manuell</option><option value="60" ${a.riddleMode==='60'?'selected':''}>60 min innan</option><option value="30" ${a.riddleMode==='30'?'selected':''}>30 min innan</option></select><p class="muted">Synlighet för Micke när aktiviteten är hemlig</p><label class="check"><input type="checkbox" id="sd-${a.id}" ${showDate?'checked':''}> Visa datum</label><label class="check"><input type="checkbox" id="st-${a.id}" ${showTime?'checked':''}> Visa tid</label><button class="btn primary" data-save-act="${a.id}">Spara</button></div>`}

function bindActivity(){document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>$(b.dataset.toggle).classList.toggle('open')); const add=$('addAct'); if(add)add.onclick=async()=>{await addDoc(collection(db,'activities'),{title:$('aTitle').value||'Ny aktivitet',date:$('aDate').value,time:$('aTime').value||'12:00',riddle:$('aRiddle').value,secret:$('aSecret').value==='true',riddleMode:$('aRiddleMode').value,showDateToMicke:$('aShowDate').checked,showTimeToMicke:$('aShowTime').checked,createdBy:name,createdAt:serverTimestamp()}); $('newAct').classList.remove('open')}; document.querySelectorAll('[data-edit-act]').forEach(b=>b.onclick=()=>$('edit-'+b.dataset.editAct).classList.toggle('open')); document.querySelectorAll('[data-save-act]').forEach(b=>b.onclick=async()=>{const id=b.dataset.saveAct; await updateDoc(doc(db,'activities',id),{title:$('t-'+id).value,date:$('d-'+id).value,time:$('tm-'+id).value,riddle:$('r-'+id).value,secret:$('s-'+id).value==='true',riddleMode:$('rm-'+id).value,showDateToMicke:$('sd-'+id).checked,showTimeToMicke:$('st-'+id).checked});}); document.querySelectorAll('[data-del-act]').forEach(b=>b.onclick=async()=>{if(confirm('Ta bort aktivitet?'))await deleteDoc(doc(db,'activities',b.dataset.delAct))}); document.querySelectorAll('[data-dup-act]').forEach(b=>b.onclick=async()=>{const a=data.activities.find(x=>x.id===b.dataset.dupAct); if(a){const {id,...copy}=a; await addDoc(collection(db,'activities'),{...copy,title:a.title+' kopia',createdAt:serverTimestamp(),createdBy:name});}}); document.querySelectorAll('[data-send-riddle]').forEach(b=>b.onclick=async()=>{const a=data.activities.find(x=>x.id===b.dataset.sendRiddle); if(a) await addDoc(collection(db,'feedPosts'),{type:'riddle',text:`🔓 Ledtråd: ${a.riddle||'Ingen gåta angiven.'}`,recipients:['Micke'],targets:['Micke'],target:'Micke',createdBy:name,createdAt:serverTimestamp()});});}

function feed(){app.innerHTML=`<section class="card"><h2>Feed</h2><button class="btn primary" data-toggle="newPost">▼ Skapa inlägg</button><div id="newPost" class="panel"><textarea id="postText" class="input" placeholder="Vad händer?"></textarea><input id="postImage" class="fileInput" type="file" accept="image/*"><div id="uploadStatus" class="progress"></div><button id="addPost" class="btn primary">Publicera</button></div>${isCrew()?`<div class="beerBox"><div class="between"><div><b>🍺 Öl-larm</b></div><button class="btn primary small" id="beerBtn">Skicka</button></div></div>`:''}</section><section class="card">${visibleFeedPosts().map(feedCard).join('')||'<p class="muted">Inga inlägg.</p>'}</section>`; document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>$(b.dataset.toggle).classList.toggle('open')); const beer=$('beerBtn'); if(beer) beer.onclick=sendBeerAlarm; $('addPost').onclick=async()=>{const text=$('postText').value.trim(); const file=$('postImage').files[0]; if(!text&&!file)return; try{$('uploadStatus').textContent=file?'Laddar upp bild...':''; let image=null; if(file) image=await uploadImage(file,'budapest-2026'); const payload={type:file?'imagePost':'post',text,createdBy:name,createdAt:serverTimestamp()}; if(image){payload.imageUrl=image.url; payload.imagePublicId=image.publicId;} await addDoc(collection(db,'feedPosts'),payload); if(image){await addDoc(collection(db,'galleryImages'),{url:image.url,publicId:image.publicId,caption:text,category:'budapest',createdBy:name,createdAt:serverTimestamp()});} $('postText').value=''; $('postImage').value=''; $('uploadStatus').textContent=''; $('newPost').classList.remove('open');}catch(e){$('uploadStatus').innerHTML=`<span class="error">${esc(e.message)}</span>`}};}
function feedCard(p){let body=''; if(p.type==='mission'){body=`<h3>🎯 ${esc(p.title||'Nytt uppdrag')}</h3>${p.description?`<p>${esc(p.description)}</p>`:''}${p.participants?.length?`<p><b>Deltagare:</b> ${p.participants.map(esc).join(', ')}</p>`:''}<span class="pill gold">${Number(p.points||p.maxPoints||0)} maxpoäng</span>`;} else if(p.type==='missionScore'){body=`<h3>🏆 Uppdrag bedömt</h3><p><b>${esc(p.title||'Uppdrag')}</b></p><p>${esc(p.summary||'')}</p>`;} else if(p.type==='punishment'){const who=peopleText(peopleList(p));body=`<h3>⚠️ Straff${who?`: ${esc(who)}`:''}</h3><p>${esc(p.description||p.text||'')}</p>${p.penaltyPoints?`<span class="pill">-${Math.abs(Number(p.penaltyPoints))} vid miss/person</span>`:''}`;} else if(p.type==='punishmentScore'){body=`<h3>⚠️ Straffstatus</h3><p>${esc(p.summary||p.text||'')}</p>`;} else if(p.type==='riddle'){body=`<h3>🔓 Ledtråd</h3><p>${esc(p.text||'')}</p>`;} else if(p.type==='beer'){body=`<h3>🍺 ÖL-LARM</h3><p>${esc(p.text||'')}</p>`;} else {body=`<p>${esc(p.text||'')}</p>`;} return `<div class="feedItem">${body}${imgTag(p.imageUrl,p.text||p.title||'Feedbild')}<br><small>${esc(p.createdBy||'')} · ${ts(p.createdAt)}</small></div>`}

function scoreButtons(m,p){return scoreOptions(m.maxPoints||m.points||0).map(v=>`<button class="btn small" data-award="${m.id}:${p}:${v}">${v>0?'+':''}${v}</button>`).join('')}
function missionOwnerTools(m,parts){return `<div class="actions"><button class="btn small" data-edit-m="${m.id}">✏️ Redigera</button>${m.status!=='published'?`<button class="btn small" data-pub-m="${m.id}">Publicera</button>`:''}<button class="btn small" data-judge-m="${m.id}">🏆 Bedöm</button><button class="btn danger small" data-del-m="${m.id}">Ta bort</button></div><div id="em-${m.id}" class="panel"><input class="input" id="mt-${m.id}" value="${esc(m.title)}"><textarea class="input" id="md-${m.id}">${esc(m.description||'')}</textarea><input class="input" id="mp-${m.id}" type="number" value="${m.maxPoints||m.points||0}"><p class="muted">Deltagare</p><div class="checkgrid">${players.map(p=>`<label class="check"><input type="checkbox" class="part-${m.id}" value="${p}" ${parts.includes(p)?'checked':''}> ${p}</label>`).join('')}</div><button class="btn primary" data-save-m="${m.id}">Spara</button></div><div id="jm-${m.id}" class="panel"><p class="muted">Bara skaparen kan bedöma detta uppdrag.</p>${parts.map(p=>`<div class="card"><h3>${p}</h3><div class="actions">${scoreButtons(m,p)}</div><div class="row"><input class="input" style="max-width:140px" type="number" id="custom-${m.id}-${p}" placeholder="Eget"><button class="btn small" data-custom-award="${m.id}:${p}">Ge</button></div></div>`).join('')}</div>`}
function punishCard(p){const owner=mine(p); const targets=getPunishmentTargets(p); return `<div class="card"><div class="between"><h3>⚠️ ${esc(p.title)}</h3><span class="pill">${esc(targetText(p))}</span></div><p>${esc(p.description||'')}</p><p class="muted">-${Math.abs(Number(p.penaltyPoints||10))} poäng om ej genomfört</p>${isCrew()?`<p class="muted">${p.status==='draft'?'Utkast':'Utdelat'} · skapad av ${esc(p.createdBy||'')}</p>`:''}${owner?`<div class="actions"><button class="btn small" data-edit-p="${p.id}">✏️ Redigera</button><button class="btn small" data-send-p="${p.id}">Dela ut</button><button class="btn small" data-done-p="${p.id}:yes">Genomfört</button><button class="btn small" data-done-p="${p.id}:no">Ej genomfört</button><button class="btn danger small" data-del-p="${p.id}">Ta bort</button></div><div id="ep-${p.id}" class="panel"><input class="input" id="pt-${p.id}" value="${esc(p.title)}"><textarea class="input" id="pd-${p.id}">${esc(p.description||'')}</textarea><p class="muted">Mottagare</p><div class="checkgrid">${players.map(x=>`<label class="check"><input type="checkbox" class="prec-${p.id}" value="${x}" ${targets.includes(x)?'checked':''}> ${x}</label>`).join('')}</div><input class="input" id="pp-${p.id}" type="number" value="${p.penaltyPoints||10}"><button class="btn primary" data-save-p="${p.id}">Spara</button></div>`:''}</div>`}
async function changeScore(player, points, source, sourceType='manual', sourceId=''){const val=Number(points||0); if(!player || Number.isNaN(val))return; await setDoc(doc(db,'scores',player),{points:(data.scores[player]||0)+val}); await addDoc(collection(db,'scoreEvents'),{player,points:val,source,sourceType,sourceId,awardedBy:name,createdAt:serverTimestamp()});}
async function awardMission(id,player,points){const m=data.missions.find(x=>x.id===id); if(!m || !mine(m))return alert('Bara skaparen kan ge poäng för detta uppdrag.'); await changeScore(player,Number(points),m.title,'mission',id);}
function selectedParts(cls){return [...document.querySelectorAll(cls)].filter(x=>x.checked).map(x=>x.value)}
function bindMission(){document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>$(b.dataset.toggle).classList.toggle('open')); const am=$('addMission'); if(am)am.onclick=async()=>{const participants=selectedParts('.mPart'); const title=$('mTitle').value||'Nytt uppdrag'; const description=$('mDesc').value; const maxPoints=Number($('mPoints').value||0); const chosen=participants.length?participants:players; const status=$('mStatus').value; await addDoc(collection(db,'missions'),{title,description,maxPoints,points:maxPoints,participants:chosen,status,createdBy:name,ownerName:name,createdAt:serverTimestamp()}); if(status==='published'){await addDoc(collection(db,'feedPosts'),{type:'mission',title,description,points:maxPoints,maxPoints,participants:chosen,targets:chosen,recipients:chosen,text:`Nytt uppdrag: ${title}`,createdBy:name,createdAt:serverTimestamp()});} $('newMission')?.classList.remove('open');}; const ap=$('addPunish'); if(ap)ap.onclick=async()=>{const targets=selectedParts('.pTarget'); const chosen=targets.length?targets:players; await addDoc(collection(db,'punishments'),{title:$('pTitle').value||'Nytt straff',description:$('pDesc').value,targets:chosen,target:chosen.join(', '),penaltyPoints:Number($('pPenalty').value||10),status:'draft',createdBy:name,ownerName:name,createdAt:serverTimestamp()}); $('newPunish')?.classList.remove('open');}; document.querySelectorAll('[data-edit-m]').forEach(b=>b.onclick=()=>$('em-'+b.dataset.editM).classList.toggle('open')); document.querySelectorAll('[data-judge-m]').forEach(b=>b.onclick=()=>$('jm-'+b.dataset.judgeM).classList.toggle('open')); document.querySelectorAll('[data-save-m]').forEach(b=>b.onclick=async()=>{const id=b.dataset.saveM; const parts=selectedParts('.part-'+id); await updateDoc(doc(db,'missions',id),{title:$('mt-'+id).value,description:$('md-'+id).value,maxPoints:Number($('mp-'+id).value||0),points:Number($('mp-'+id).value||0),participants:parts.length?parts:players});}); document.querySelectorAll('[data-pub-m]').forEach(b=>b.onclick=async()=>{const m=data.missions.find(x=>x.id===b.dataset.pubM); if(!m || !mine(m))return alert('Bara skaparen kan publicera.'); await updateDoc(doc(db,'missions',b.dataset.pubM),{status:'published'}); await addDoc(collection(db,'feedPosts'),{type:'mission',title:m.title,description:m.description||'',points:Number(m.maxPoints||m.points||0),maxPoints:Number(m.maxPoints||m.points||0),participants:m.participants||players,targets:m.participants||players,recipients:m.participants||players,text:`Nytt uppdrag: ${m.title}`,createdBy:name,createdAt:serverTimestamp()});}); document.querySelectorAll('[data-del-m]').forEach(b=>b.onclick=async()=>{const m=data.missions.find(x=>x.id===b.dataset.delM); if(!m || !mine(m))return alert('Bara skaparen kan ta bort.'); if(confirm('Ta bort uppdrag?'))await deleteDoc(doc(db,'missions',b.dataset.delM))}); document.querySelectorAll('[data-award]').forEach(b=>b.onclick=async()=>{const [id,p,v]=b.dataset.award.split(':'); await awardMission(id,p,v);}); document.querySelectorAll('[data-custom-award]').forEach(b=>b.onclick=async()=>{const [id,p]=b.dataset.customAward.split(':'); const v=$('custom-'+id+'-'+p).value; await awardMission(id,p,v);}); document.querySelectorAll('[data-edit-p]').forEach(b=>b.onclick=()=>$('ep-'+b.dataset.editP).classList.toggle('open')); document.querySelectorAll('[data-save-p]').forEach(b=>b.onclick=async()=>{const id=b.dataset.saveP; const p=data.punishments.find(x=>x.id===id); if(!p || !mine(p))return alert('Bara skaparen kan redigera.'); const targets=selectedParts('.prec-'+id); const chosen=targets.length?targets:players; await updateDoc(doc(db,'punishments',id),{title:$('pt-'+id).value,description:$('pd-'+id).value,targets:chosen,target:chosen.join(', '),penaltyPoints:Number($('pp-'+id).value||10)});}); document.querySelectorAll('[data-send-p]').forEach(b=>b.onclick=async()=>{const p=data.punishments.find(x=>x.id===b.dataset.sendP); if(!p || !mine(p))return alert('Bara skaparen kan dela ut.'); await updateDoc(doc(db,'punishments',b.dataset.sendP),{status:'published'}); const targets=peopleList(p); await addDoc(collection(db,'feedPosts'),{type:'punishment',title:p.title,description:p.description||p.title,targets,target:peopleText(targets),penaltyPoints:p.penaltyPoints||10,text:`⚠️ ${peopleText(targets)} fick straff: ${p.title}`,createdBy:name,createdAt:serverTimestamp()});}); document.querySelectorAll('[data-done-p]').forEach(b=>b.onclick=async()=>{const [id,done]=b.dataset.doneP.split(':'); const p=data.punishments.find(x=>x.id===id); if(!p || !mine(p))return alert('Bara skaparen kan bedöma.'); const targets=peopleList(p); if(done==='no'){for(const t of targets){await changeScore(t,-Math.abs(Number(p.penaltyPoints||10)),p.title,'punishment',id);} alert(`${peopleText(targets)} fick -${Math.abs(Number(p.penaltyPoints||10))} poäng/person.`);} else {alert(`${peopleText(targets)} genomförde straffet.`);}}); document.querySelectorAll('[data-del-p]').forEach(b=>b.onclick=async()=>{const p=data.punishments.find(x=>x.id===b.dataset.delP); if(!p || !mine(p))return alert('Bara skaparen kan ta bort.'); if(confirm('Ta bort straff?'))await deleteDoc(doc(db,'punishments',b.dataset.delP))});}
function score(){app.innerHTML=`<section class="card"><h2>Poäng</h2>${scoreList(false)}</section><section class="card"><h2>🍺 Öl-larmsligan</h2>${beerLeague()}</section>${isCrew()?`<section class="card"><h2>Poängkorrigering</h2><div class="grid"><select id="corrPlayer" class="input">${displayPlayers.map(p=>`<option>${p}</option>`).join('')}</select><input id="corrPoints" class="input" type="number" placeholder="+/- poäng"></div><button class="btn primary" id="corrBtn">Spara</button><p id="corrStatus" class="muted"></p></section>`:''}<section class="card"><h2>Poänglogg</h2>${displayPlayers.map(p=>`<details class="card"><summary><b>${p}</b> · ${data.scores[p]||0} poäng</summary>${data.scoreEvents.filter(e=>e.player===p).map(e=>`<div class="logItem"><b>${Number(e.points)>=0?'+':''}${e.points}</b> ${esc(e.source||'Poäng')}<br><small>Av ${esc(e.awardedBy||'')} · ${ts(e.createdAt)}</small></div>`).join('')||'<p class="muted">Ingen poänghistorik ännu.</p>'}</details>`).join('')}</section>${name==='Linus'?`<section class="card"><h2>🧹 Reset testdata</h2><p class="muted">Tar bort feed, uppdrag, straff, poänglogg och Budapest 2026-bilder i appen. Behåller användare, schema, Hall Of Meek och öl-bilder.</p><button class="btn danger" id="resetBtn">Nollställ testdata</button><p id="resetStatus" class="muted"></p></section>`:''}`; const rb=$('resetBtn'); if(rb)rb.onclick=resetTestData; const cb=$('corrBtn'); if(cb)cb.onclick=async()=>{const player=$('corrPlayer').value; const points=Number($('corrPoints').value||0); if(!points)return alert('Skriv en poängändring, t.ex. 5 eller -5.'); await changeScore(player,points,'Poängkorrigering','correction',''); $('corrPoints').value=''; const st=$('corrStatus'); if(st)st.textContent='Korrigering sparad.';};}
function rankIcon(i,total){if(i===0)return '🥇'; if(i===1)return '🥈'; if(i===2)return '🥉'; if(i===total-1)return '🗑️'; if(i===3)return '🍺'; return '•'}
function scoreList(compact){const rows=displayPlayers.map(p=>[p,data.scores[p]||0]).sort((a,b)=>b[1]-a[1]||displayPlayers.indexOf(a[0])-displayPlayers.indexOf(b[0])); return rows.map(([p,v],i)=>`<div class="score"><span>${rankIcon(i,rows.length)} ${p}</span><b>${v} p</b></div>`).join('')}
function beerCounts(){const counts=Object.fromEntries(beerPlayers.map(p=>[p,0])); visibleFeedPosts().forEach(p=>{if(p.type==='beer'&&counts[p.createdBy]!==undefined)counts[p.createdBy]+=1}); return counts}
function beerLeague(){const counts=beerCounts(); const total=Object.values(counts).reduce((a,b)=>a+b,0); const rows=beerPlayers.map(p=>[p,counts[p]||0]).sort((a,b)=>b[1]-a[1]||beerPlayers.indexOf(a[0])-beerPlayers.indexOf(b[0])); return `<div class="score"><span>Totalt</span><b>${total} larm</b></div>${rows.map(([p,v],i)=>`<div class="score"><span>${rankIcon(i,rows.length)} ${p}</span><b>${v} larm</b></div>`).join('')}`}

async function clearCollection(col){const snap=await getDocs(collection(db,col)); for(const d of snap.docs){await deleteDoc(doc(db,col,d.id));}}
async function resetTestData(){if(name!=='Linus')return alert('Endast Linus kan nollställa testdata.'); const ok=prompt('Detta tar bort feed, uppdrag, straff, poänglogg och Budapest-bilder i appen. Skriv RESET för att bekräfta.'); if(ok!=='RESET')return; const status=$('resetStatus'); if(status)status.textContent='Nollställer testdata...'; for(const col of ['feedPosts','missions','punishments','scoreEvents','galleryImages']){await clearCollection(col);} for(const p of players){await setDoc(doc(db,'scores',p),{points:0});} if(status)status.textContent='Klart! Testdata är nollställd.';}
function gallery(){const bud=data.galleryImages.filter(i=>i.category==='budapest'); const allShame=[...STATIC_HALL_IMAGES,...data.galleryImages.filter(i=>i.category==='shame')]; const shame=getHallSelection(allShame); app.innerHTML=`${isCrew()?`<section class="card"><h2>Lägg till bild</h2><button class="btn primary" data-toggle="galleryUpload">▼ Ladda upp</button><div id="galleryUpload" class="panel"><input id="galleryFile" class="fileInput" type="file" accept="image/*"><textarea id="galleryCaption" class="input" placeholder="Caption"></textarea><select id="galleryCategory" class="input"><option value="budapest">Budapest 2026</option><option value="shame">Hall Of Meek</option></select><div id="galleryStatus" class="progress"></div><button id="uploadGallery" class="btn primary">Ladda upp</button></div></section>`:''}<section class="card"><h2>Budapest 2026</h2>${bud.length?galleryByDay(bud):'<p class="muted">Bilder från feeden hamnar här automatiskt.</p>'}</section><section class="card"><h2>Hall Of Meek</h2><p class="muted">${randomItem(['Meek-arkivet','Dokumentation av tidigare beslut','Material som Micke helst vill glömma','Mickes juridiska ombud avråder från vidare granskning','Klassificerat Meek-material','Historiska misstag'])}</p>${shame.length?`<div class="galleryGrid">${shame.map(galleryItem).join('')}</div>`:'<p class="muted">Lägg in klassiska Micke-bilder här.</p>'}</section><div id="imageModal" class="modal"><div class="modalBox"><div class="between"><b id="modalTitle">Bild</b><button class="btn small" id="closeModal">Stäng</button></div><div class="sep"></div><img id="modalImg" class="modalImg" src="" alt=""><p id="modalCaption"></p><small id="modalMeta" class="muted"></small><br><a id="modalSave" class="saveLine" href="#">⬇ Spara bild</a><button id="modalDelete" class="btn danger small hidden" style="margin-top:10px">🗑️ Ta bort från Budapest 2026</button></div></div>`; document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>$(b.dataset.toggle).classList.toggle('open')); document.querySelectorAll('[data-gallery-id]').forEach(el=>el.onclick=()=>openImageModal(el.dataset.galleryId)); document.querySelectorAll('[data-delete-image]').forEach(b=>b.onclick=e=>{e.stopPropagation(); deleteGalleryImage(b.dataset.deleteImage)}); const close=$('closeModal'); if(close) close.onclick=()=>$('imageModal').classList.remove('open'); const modal=$('imageModal'); if(modal) modal.onclick=e=>{if(e.target===modal) modal.classList.remove('open')}; const up=$('uploadGallery'); if(up)up.onclick=async()=>{const file=$('galleryFile').files[0]; if(!file)return alert('Välj en bild först.'); try{$('galleryStatus').textContent='Laddar upp bild...'; const cat=$('galleryCategory').value; const image=await uploadImage(file,cat==='shame'?'hall-of-shame':'budapest-2026'); const caption=$('galleryCaption').value.trim(); await addDoc(collection(db,'galleryImages'),{url:image.url,publicId:image.publicId,caption,category:cat,createdBy:name,createdAt:serverTimestamp()}); if(cat==='budapest'){await addDoc(collection(db,'feedPosts'),{type:'imagePost',text:caption||'Ny bild uppladdad',imageUrl:image.url,imagePublicId:image.publicId,createdBy:name,createdAt:serverTimestamp()});} $('galleryStatus').textContent='Uppladdad!'; $('galleryFile').value=''; $('galleryCaption').value='';}catch(e){$('galleryStatus').innerHTML=`<span class="error">${esc(e.message)}</span>`}};} 
function galleryByDay(items){const groups={}; items.forEach(i=>{const key=dayKey(i.createdAt); (groups[key]||(groups[key]=[])).push(i)}); return Object.keys(groups).map(day=>`<h3 class="dayTitle">${day}</h3><div class="galleryGrid">${groups[day].map(galleryItem).join('')}</div>`).join('')}
function dayKey(tsv){const d=toDate(tsv); if(!d)return 'Okänt datum'; return d.toLocaleDateString('sv-SE',{weekday:'long',day:'numeric',month:'long'}).replace(/^./,c=>c.toUpperCase())}
function toDate(tsv){if(!tsv)return null; if(tsv.toDate)return tsv.toDate(); if(tsv.seconds)return new Date(tsv.seconds*1000); const d=new Date(tsv); return isNaN(d)?null:d}
function galleryItem(g){const canDelete=isCrew()&&g.category==='budapest'&&!String(g.id).startsWith('static-'); return `<div class="galleryItem" data-gallery-id="${g.id}"><img src="${esc(g.url)}" alt="${esc(g.caption||'Bild')}" loading="lazy" onerror="this.alt='Bilden hittades inte. Kontrollera att Micke-bilderna ligger i roten i GitHub.'">${g.caption?`<p>${esc(g.caption)}</p>`:''}<small>${esc(g.createdBy||'')} · ${ts(g.createdAt)}</small>${canDelete?`<button class="btn small galleryDelete" data-delete-image="${g.id}">🗑️ Ta bort</button>`:''}</div>`}
function openImageModal(id){const g=[...STATIC_HALL_IMAGES,...data.galleryImages].find(x=>x.id===id); if(!g)return; $('modalTitle').textContent=g.category==='shame'?'Hall Of Meek':'Budapest 2026'; $('modalImg').src=g.url; $('modalImg').alt=g.caption||'Bild'; $('modalCaption').textContent=g.caption||''; $('modalMeta').textContent=`${g.createdBy||''} · ${ts(g.createdAt)}`; const save=$('modalSave'); if(save){save.href=downloadUrl(g.url); save.onclick=(e)=>{e.preventDefault(); smartSaveImage(g.url);};} const del=$('modalDelete'); if(del){if(isCrew()&&g.category==='budapest'&&!String(g.id).startsWith('static-')){del.classList.remove('hidden'); del.onclick=()=>deleteGalleryImage(g.id)}else{del.classList.add('hidden'); del.onclick=null}} $('imageModal').classList.add('open')}
function getHallSelection(all){if(!all.length)return []; const key='hallSelectionV293'; let ids=[]; try{ids=JSON.parse(sessionStorage.getItem(key)||'[]')}catch(e){} let chosen=ids.map(id=>all.find(x=>x.id===id)).filter(Boolean); if(chosen.length!==Math.min(2,all.length)){const shuffled=[...all].sort(()=>Math.random()-.5); chosen=shuffled.slice(0,2); try{sessionStorage.setItem(key,JSON.stringify(chosen.map(x=>x.id)))}catch(e){}} return chosen}
async function deleteGalleryImage(id){const g=data.galleryImages.find(x=>x.id===id); if(!g)return; if(!confirm('Ta bort bilden från Budapest 2026 i appen?'))return; await deleteDoc(doc(db,'galleryImages',id)); const matches=data.feedPosts.filter(p=>p.imagePublicId&&g.publicId&&p.imagePublicId===g.publicId); for(const post of matches){await deleteDoc(doc(db,'feedPosts',post.id));} const modal=$('imageModal'); if(modal)modal.classList.remove('open')}


async function loadPushStatus(){
  pushEnabled=false;
  if(!user) return;
  try{
    const ref=doc(db,'pushTokens',user.uid);
    const snap=await getDoc(ref);
    pushEnabled=!!(snap.exists()&&snap.data()?.token&&snap.data()?.enabled!==false);
    if(snap.exists()){
      const d=snap.data()||{};
      if(d.name!==name || d.role!==role){
        await setDoc(ref,{...d,name,canonicalName:name,role,email:user.email,userId:user.uid,updatedAt:serverTimestamp()});
      }
    }
  }catch(e){pushEnabled=false;}
  updatePushButton();
}
async function ensureServiceWorker(){
  if(!('serviceWorker' in navigator)) throw new Error('Service worker stöds inte i den här webbläsaren.');
  const reg=await navigator.serviceWorker.register('./service-worker.js');
  return reg;
}
async function setupForegroundMessaging(){
  if(messagingReady) return;
  const supported=await isSupported().catch(()=>false);
  if(!supported) return;
  messaging=getMessaging(fb);
  messagingReady=true;
  onMessage(messaging,(payload)=>{
    const p={type:'push',title:payload.notification?.title||payload.data?.title||'🔔 Notis',text:payload.notification?.body||payload.data?.body||'',imageUrl:payload.notification?.image||payload.data?.image||''};
    showToast({type:'beer',text:`${p.title}${p.text?' · '+p.text:''}`,imageUrl:p.imageUrl,createdBy:'Push'});
  });
}
async function enablePushNotifications(){
  try{
    const supported=await isSupported().catch(()=>false);
    if(!supported){alert('Telefonnotiser stöds inte i den här webbläsaren. På iPhone: öppna appen från hemskärmsikonen.');return;}
    if(!('Notification' in window)){alert('Notiser stöds inte här.');return;}
    const permission=await Notification.requestPermission();
    if(permission!=='granted'){alert('Notiser nekades. Du kan ändra detta i telefonens inställningar.');return;}
    const reg=await ensureServiceWorker();
    messaging=getMessaging(fb);
    const token=await getToken(messaging,{vapidKey:VAPID_KEY,serviceWorkerRegistration:reg});
    if(!token){alert('Kunde inte skapa push-token. Testa att öppna appen från hemskärmen.');return;}
    await setDoc(doc(db,'pushTokens',user.uid),{token,userId:user.uid,email:user.email,name,canonicalName:name,role,enabled:true,updatedAt:serverTimestamp()});
    pushEnabled=true;
    await setupForegroundMessaging();
    updatePushButton();
    alert(`Telefonnotiser är aktiverade för ${name} på den här enheten.`);
  }catch(e){console.error(e); alert('Kunde inte aktivera telefonnotiser: '+(e.message||e));}
}
async function disablePushNotifications(){
  if(!user)return;
  const ok=confirm('Stäng av pushnotiser för den här enheten?');
  if(!ok)return;
  try{
    await updateDoc(doc(db,'pushTokens',user.uid),{enabled:false,updatedAt:serverTimestamp()}).catch(()=>deleteDoc(doc(db,'pushTokens',user.uid)));
    pushEnabled=false;
    updatePushButton();
    alert(`Pushnotiser är avstängda för ${name} på den här enheten.`);
  }catch(e){console.error(e); alert('Kunde inte stänga av notiser: '+(e.message||e));}
}
async function togglePushNotifications(){
  if(pushEnabled) return disablePushNotifications();
  return enablePushNotifications();
}
